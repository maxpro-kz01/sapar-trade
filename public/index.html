// Демо: позиции рассчитываются по плановому маршруту и времени. На рабочей версии
// приложение водителя отправляет координаты на сервер каждые 30–60 сек (только в
// рабочее время), а эта карта получает их с сервера.
const KZO_CENTER = [44.8465, 65.4935];
const KZO_WAREHOUSE = { name: "Склад Sapar Trade", addr: "г. Кызылорда, ул. Бокейхана, 2", lat: 44.8362, lng: 65.5138 };
const FLEET_COLORS = ["#1B1464", "#E2231A", "#0B8A5A", "#C27A00"];

const FLEET = (() => {
  const r = mkRng(4412);
  const base = [
    { id: "dr1", name: "Серик Алимов", car: "Isuzu · 777 ABZ 11", phone: "+7 701 411 22 10", start: [8, 40] },
    { id: "dr2", name: "Бауржан Нуров", car: "Hyundai Porter · 512 KLM 11", phone: "+7 705 318 40 77", start: [9, 30] },
    { id: "dr3", name: "Ерболат Сарсенов", car: "Газель Next · 245 AAB 11", phone: "+7 747 902 15 36", start: [10, 15] },
  ];
  return base.map((d, i) => {
    const stops = MG.clients.filter((_, k) => k % base.length === i).slice(0, 6).map((c) => {
      const [la, ln] = c.gps.split(",").map(Number);
      return { name: c.name, addr: c.addr, lat: la, lng: ln, dwell: 20 + Math.floor(r() * 16) };
    });
    return { ...d, color: FLEET_COLORS[i], stops, speed: 24 + r() * 8, lostSignal: i === 2 };
  });
})();

function haversineKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLa = (b.lat - a.lat) * rad, dLn = (b.lng - a.lng) * rad;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLn / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

// Позиция водителя на момент t (мс) по плану: склад → точки → склад.
function fleetState(d, t) {
  const pts = [KZO_WAREHOUSE, ...d.stops, KZO_WAREHOUSE];
  let clock = sod(new Date(t)).getTime() + (d.start[0] * 60 + d.start[1]) * 60000;
  const track = [[KZO_WAREHOUSE.lat, KZO_WAREHOUSE.lng]];
  let km = 0;
  if (t < clock) return { status: "wait", pos: KZO_WAREHOUSE, track, km: 0, done: 0, speed: 0, eta: new Date(clock) };
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const dist = haversineKm(a, b) * 1.3; // по дорогам длиннее, чем по прямой
    const legMs = (dist / d.speed) * 3600000;
    if (t < clock + legMs) {
      const f = (t - clock) / legMs;
      const pos = { lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f };
      track.push([pos.lat, pos.lng]);
      return { status: i === pts.length - 1 ? "return" : "drive", pos, track, km: km + dist * f, done: i - 1, speed: Math.round(d.speed + Math.sin(t / 20000) * 5), legTo: b, eta: new Date(clock + legMs) };
    }
    clock += legMs; km += dist; track.push([b.lat, b.lng]);
    if (i === pts.length - 1) break;
    const dwellMs = b.dwell * 60000;
    if (t < clock + dwellMs) return { status: "stop", pos: b, track, km, done: i - 1, speed: 0, at: b, since: new Date(clock) };
    clock += dwellMs;
  }
  return { status: "back", pos: KZO_WAREHOUSE, track, km, done: d.stops.length, speed: 0 };
}

const FLEET_STATUS = {
  wait: ["Ещё не выехал", "#77748C"], drive: ["В пути", "#0B5A8A"], stop: ["На точке", "#8A5A00"],
  return: ["Возвращается на склад", "#0B5A8A"], back: ["Рейс завершён", "#127A33"], lost: ["Нет сигнала", "#B3261E"],
};

function useLeaflet() {
  const [L, setL] = useState(window.L || null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (window.L) { setL(window.L); return; }
    if (!document.getElementById("leaflet-css")) {
      const l = document.createElement("link"); l.id = "leaflet-css"; l.rel = "stylesheet";
      l.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(l);
    }
    let s = document.getElementById("leaflet-js");
    if (!s) { s = document.createElement("script"); s.id = "leaflet-js"; s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; document.head.appendChild(s); }
    const ok = () => setL(window.L); const bad = () => setFailed(true);
    s.addEventListener("load", ok); s.addEventListener("error", bad);
    const to = setTimeout(() => { if (!window.L) setFailed(true); }, 9000);
    return () => { s.removeEventListener("load", ok); s.removeEventListener("error", bad); clearTimeout(to); };
  }, []);
  return { L, failed };
}

function FleetLeafletMap({ L, items, focus, onPick }) {
  const box = useRef(null), map = useRef(null), layer = useRef(null);
  useEffect(() => {
    if (!L || !box.current || map.current) return;
    const m = L.map(box.current, { zoomControl: true, attributionControl: true }).setView(KZO_CENTER, 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
    L.marker([KZO_WAREHOUSE.lat, KZO_WAREHOUSE.lng], { icon: L.divIcon({ className: "", html: '<div style="width:26px;height:26px;border-radius:8px;background:#161327;color:#fff;font:700 12px Manrope,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)">С</div>', iconSize: [26, 26], iconAnchor: [13, 13] }) })
      .addTo(m).bindTooltip(KZO_WAREHOUSE.name);
    layer.current = L.layerGroup().addTo(m);
    map.current = m;
    setTimeout(() => m.invalidateSize(), 250);
    return () => { m.remove(); map.current = null; layer.current = null; };
  }, [L]);
  useEffect(() => {
    if (!L || !layer.current) return;
    const g = layer.current; g.clearLayers();
    items.forEach(({ d, s, lost }) => {
      const show = !focus || focus === d.id;
      const col = lost ? "#9A97AE" : d.color;
      L.polyline([[KZO_WAREHOUSE.lat, KZO_WAREHOUSE.lng], ...d.stops.map((p) => [p.lat, p.lng]), [KZO_WAREHOUSE.lat, KZO_WAREHOUSE.lng]], { color: col, weight: 2, opacity: show ? 0.35 : 0.1, dashArray: "5 6" }).addTo(g);
      L.polyline(s.track, { color: col, weight: 4, opacity: show ? 0.9 : 0.2 }).addTo(g);
      d.stops.forEach((p, k) => {
        L.circleMarker([p.lat, p.lng], { radius: 5, color: "#fff", weight: 1.5, fillColor: k < s.done ? "#1FA854" : col, fillOpacity: show ? 0.95 : 0.25 }).addTo(g).bindTooltip((k + 1) + ". " + p.name);
      });
      const ini = d.name.split(" ").map((x) => x[0]).join("");
      L.marker([s.pos.lat, s.pos.lng], { zIndexOffset: 1000, icon: L.divIcon({ className: "", html: '<div style="width:34px;height:34px;border-radius:50%;background:' + col + ';color:#fff;font:800 12px Manrope,sans-serif;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);opacity:' + (show ? 1 : 0.45) + '">' + ini + "</div>", iconSize: [34, 34], iconAnchor: [17, 17] }) })
        .addTo(g).on("click", () => onPick(d.id));
    });
  }, [L, items, focus]);
  useEffect(() => {
    if (!map.current) return;
    const it = items.find((x) => x.d.id === focus);
    if (it) map.current.flyTo([it.s.pos.lat, it.s.pos.lng], 15, { duration: 0.6 });
    else map.current.flyTo(KZO_CENTER, 13, { duration: 0.6 });
  }, [focus]);
  return <div ref={box} style={{ height: 330, width: "100%", borderRadius: 16, overflow: "hidden", position: "relative", zIndex: 0, border: "1px solid var(--line)" }} />;
}

// Запасная схема, если карта не загрузилась (нет интернета)
function FleetSchemeMap({ items, focus, onPick }) {
  const all = [KZO_WAREHOUSE, ...items.flatMap(({ d }) => d.stops)];
  const la = all.map((p) => p.lat), ln = all.map((p) => p.lng);
  const b = { a: Math.min(...la) - 0.004, z: Math.max(...la) + 0.004, c: Math.min(...ln) - 0.006, d: Math.max(...ln) + 0.006 };
  const X = (p) => 10 + ((p.lng - b.c) / (b.d - b.c)) * 300, Y = (p) => 10 + (1 - (p.lat - b.a) / (b.z - b.a)) * 210;
  return (
    <div className="rounded-xl overflow-hidden" style={{ background: "#F3F6FB", border: "1px solid var(--line)" }}>
      <svg viewBox="0 0 320 230" width="100%" height="230">
        {items.map(({ d, s, lost }) => {
          const col = lost ? "#9A97AE" : d.color;
          return (
            <g key={d.id} opacity={focus && focus !== d.id ? 0.25 : 1}>
              <polyline points={s.track.map(([a, c]) => X({ lat: a, lng: c }) + "," + Y({ lat: a, lng: c })).join(" ")} fill="none" stroke={col} strokeWidth="3" />
              {d.stops.map((p, k) => <circle key={k} cx={X(p)} cy={Y(p)} r="4" fill={k < s.done ? "#1FA854" : col} />)}
              <circle cx={X(s.pos)} cy={Y(s.pos)} r="9" fill={col} stroke="#fff" strokeWidth="2" onClick={() => onPick(d.id)} />
            </g>
          );
        })}
        <rect x={X(KZO_WAREHOUSE) - 6} y={Y(KZO_WAREHOUSE) - 6} width="12" height="12" rx="3" fill="#161327" />
      </svg>
    </div>
  );
}

    // в демо вне утреннего рейса показываем 11:00, чтобы на карте было движение
    base.current = { real: Date.now(), sim: h >= 8.7 && h <= 12.5 ? Date.now() : sod(d).getTime() + 11 * 3600000, k: 1 };
  }
  useEffect(() => { addAudit(R.person, "Просмотр GPS экспедиторов", "Карта", "Кызылорда"); }, []);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), fast ? 1000 : 5000); return () => clearInterval(t); }, [fast]);

        GPS фиксируется только в рабочее время и только на служебном маршруте. Карту видят только владелец и директор. Демо-режим: позиции рассчитаны по маршруту; в рабочей версии их присылает телефон водителя через сервер.
      </p>
    </div>
  );
}

// Карточка в приложении водителя: включение передачи GPS
function MgDriverGps() {
  const [pos, setPos] = useState(null);
  const [err, setErr] = useState("");
  const [on, setOn] = useState(false);
  const watch = useRef(null);
  useEffect(() => () => { if (watch.current !== null && navigator.geolocation) navigator.geolocation.clearWatch(watch.current); }, []);
  const toggle = (v) => {
    setErr("");
    if (!v) { if (watch.current !== null) navigator.geolocation.clearWatch(watch.current); watch.current = null; setOn(false); return; }
    if (!navigator.geolocation) { setErr("Телефон не поддерживает GPS"); return; }
    setOn(true);
    watch.current = navigator.geolocation.watchPosition(
      (p) => setPos({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), t: new Date() }),
      () => { setErr("Нет доступа к геолокации — разрешите его в настройках браузера"); setOn(false); },
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
  };
  return (
    <MgCard>
      <div className="flex items-center justify-between" style={{ gap: 8 }}>
        <div>
          <p style={{ fontSize: 13, fontWeight: 800 }}>Передача GPS</p>
          <p style={{ fontSize: 11, color: "var(--muted)" }}>Ваше местоположение видят владелец и директор</p>
        </div>
        <Toggle checked={on} onChange={toggle} />
      </div>
      {pos && <p className="font-mono-kz" style={{ fontSize: 11.5, marginTop: 6 }}>{pos.lat.toFixed(5)}, {pos.lng.toFixed(5)} · ±{pos.acc} м · {hm(pos.t)}</p>}
      {err && <p style={{ fontSize: 11.5, color: "var(--red)", marginTop: 6 }}>{err}</p>}
    </MgCard>
  );
}

function MgmtLogin({ onCancel, onSuccess, addAudit, lang, setLang }) {
  const [role, setRole] = useState(null);
  const [pwd, setPwd] = useState("");
  const [code, setCode] = useState("");
  const [step, setStep] = useState(1);
  const [err, setErr] = useState("");
  const R = role && MG_ROLES[role];
  const submit = () => {
    setErr("");
    if (step === 1) {
      if (pwd !== "1234") { setErr("Неверный пароль"); addAudit("Система", "Неудачный вход", R.label, "неверный пароль"); return; }
      if (R.twofa) { setStep(2); return; }
    } else if (code !== "2026") { setErr("Неверный код подтверждения"); return; }
    addAudit(R.person, "Вход в систему управления", R.label, R.twofa ? "пароль + 2FA" : "пароль");
    onSuccess(role);
  };
  return (
    <div className="relative h-full" style={{ background: "var(--bg)" }}>
      <StatusBar />
      <div className="flex flex-col h-full px-6 pt-4 font-body overflow-y-auto pb-8">
        <div className="flex items-center justify-between mb-4">
          <button onClick={role ? () => { setRole(null); setStep(1); setPwd(""); setCode(""); setErr(""); } : onCancel} className="p-2 -ml-2 rounded-full"><Ico name="arrow-left" size={20} color="var(--ink)" /></button>
          <LangSwitch lang={lang} setLang={setLang} />
        </div>
        <div className="flex flex-col items-center mb-5">
          <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-3" style={{ background: "var(--navy)" }}><Ico name="bar-chart" size={28} color="#fff" /></div>
          <h1 className="font-display text-center" style={{ fontSize: 18, fontWeight: 800, color: "var(--ink)" }}>Система управления</h1>
          <p className="text-center" style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 2 }}>{R ? R.label : "Выберите свою должность"}</p>
        </div>
        {!R && Object.entries(MG_ROLES).map(([id, r]) => (
          <button key={id} onClick={() => setRole(id)} className="rounded-2xl p-3.5 mb-2.5 flex items-center gap-3 press-98" style={{ border: "1.5px solid var(--line)", background: "#fff" }}>

            <div className="flex-1 text-left">
              <p style={{ fontSize: 13.5, fontWeight: 700, color: "var(--ink)" }}>{r.label}</p>
              <p style={{ fontSize: 11, color: "var(--muted)" }}>{r.sub}</p>
            </div>
          </button>
        ))}
        {R && (
          <>
            {step === 1
              ? <Field label="Пароль" type="password" value={pwd} onChange={(e) => setPwd(e.target.value)} />
              : <Field label="Код подтверждения (2FA)" inputMode="numeric" value={code} onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))} />}
            {err && <p style={{ fontSize: 12, color: "var(--red)", marginBottom: 10 }}>{err}</p>}
            <PrimaryButton full onClick={submit}>{step === 1 ? "Войти" : "Подтвердить"}</PrimaryButton>
            <div className="rounded-xl p-3 mt-3" style={{ background: "#FFF6DE" }}>
              <p style={{ fontSize: 11.5, color: "#8A5A00", lineHeight: 1.45 }}>
                Демо-доступ: пароль 1234{R.twofa ? ", код 2FA 2026" : ""}. На рабочем сервере — личные пароли (хранятся в виде хэша), двухфакторная защита для владельца и директора, контроль сессий и устройств.
              </p>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function MgSales({ role, cur, prev, rg, go }) {
  const fin = MG_ROLES[role].fin;
  const now = new Date();
  const m = mgAgg(new Date(now.getFullYear(), now.getMonth(), 1), now);
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const passed = now.getDate();
  const monthPlan = m.plan / passed * dim;
  const forecast = m.netRev / passed * dim;
  const need = Math.max(0, monthPlan - m.netRev);
  const active = MG.clients.filter((c) => c.status === "active").length;
  const fresh = MG.clients.filter((c) => c.status === "new").length;
  const lost = MG.clients.filter((c) => c.status === "lost").length;
  const ordered = MG.clients.filter((c) => c.lastOrder <= 7).length;
  const byTeam = MG.supervisors.map((s) => ({ s, a: mgAgg(rg.from, rg.to, { sv: s.id }) }));

    <div>
      <div className="grid grid-cols-2 gap-2 mb-3">

        <p style={{ fontSize: 13, fontWeight: 800, marginBottom: 4 }}>Текущий месяц</p>
        <MgRow l="План на месяц" v={shortMoney(monthPlan)} />
        <MgRow l="Факт на сегодня" v={shortMoney(m.netRev)} />
        <MgRow l="Дневной темп" v={shortMoney(m.netRev / passed)} />
        <MgRow l="Прогноз на конец месяца" v={shortMoney(forecast)} strong color={forecast >= monthPlan ? "#127A33" : "var(--red)"} />
        <MgRow l="Нужно продавать в день до плана" v={shortMoney(need / Math.max(1, dim - passed))} />

function MgRouteMap({ tpId }) {
  const r = mkRng(tpId.charCodeAt(2) * 97 + new Date().getDate());
  const pool = [...MG.clients.filter((c) => c.tp === tpId), ...MG.clients.filter((c) => c.tp !== tpId)].slice(0, 7);
  let h = 9, m = 5;
  const tick = (n) => { m += n; while (m >= 60) { m -= 60; h++; } };
  const hhmm = () => String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
  const pts = pool.map((c, i) => {
    const arr = hhmm(); const dur = 12 + Math.floor(r() * 25); tick(dur); const dep = hhmm(); tick(10 + Math.floor(r() * 25));
    return { c, x: 26 + i * 42 + r() * 10, y: 25 + r() * 90, arr, dep, dur, sum: r() < 0.75 ? Math.round(r() * 300000 / 100) * 100 : 0, dev: r() < 0.15 };
  });
  const path = "12,130 " + pts.map((p) => p.x + "," + p.y).join(" ");
  return (
    <div>
      <div className="rounded-xl overflow-hidden mb-2" style={{ background: "#F3F6FB", border: "1px solid var(--line)" }}>
        <svg viewBox="0 0 320 150" width="100%" height="150">
          {[30, 60, 90, 120].map((y) => <line key={y} x1="0" x2="320" y1={y} y2={y} stroke="#E4E8F2" />)}
          {[60, 120, 180, 240, 300].map((x) => <line key={x} y1="0" y2="150" x1={x} x2={x} stroke="#E4E8F2" />)}
          <polyline points={path} fill="none" stroke="#1B1464" strokeWidth="2.2" strokeDasharray="5 4" />
          <circle cx="12" cy="130" r="6" fill="#1FA854" />
          {pts.map((p, i) => (
            <g key={i}>
              <circle cx={p.x} cy={p.y} r="9" fill={p.dev ? "#E2231A" : p.sum ? "#1B1464" : "#9A97AE"} />
              <text x={p.x} y={p.y + 3.5} textAnchor="middle" fontSize="9" fill="#fff" fontWeight="700">{i + 1}</text>
            </g>
          ))}
        </svg>
      </div>
      <p style={{ fontSize: 10.5, color: "var(--muted)", marginBottom: 6 }}>Зелёная — старт, синие — точки с заказом, серые — без заказа, красные — отклонение от маршрута. GPS фиксируется только в рабочее время.</p>
      {pts.map((p, i) => (
        <div key={i} className="flex items-center gap-2 py-1.5" style={{ borderBottom: "1px dashed var(--line)" }}>
          <span className="font-mono-kz" style={{ fontSize: 11, fontWeight: 800, width: 16 }}>{i + 1}</span>
          <div className="flex-1 min-w-0">
            <p style={{ fontSize: 12, fontWeight: 700 }} className="truncate">{p.c.name}{p.dev ? " · отклонение" : ""}</p>
            <p className="font-mono-kz" style={{ fontSize: 10.5, color: "var(--muted)" }}>{p.arr}–{p.dep} · {p.dur} мин</p>
          </div>
          <span className="font-mono-kz" style={{ fontSize: 11.5, fontWeight: 700, color: p.sum ? "var(--ink)" : "var(--muted)" }}>{p.sum ? money(p.sum) : "без заказа"}</span>
        </div>
      ))}
    </div>
  );
}

    if (!f.title.trim()) return;

            {TASK_ST.map((s) => <button key={s} onClick={() => setStatus(openT, s)} className="rounded-xl py-2 font-semibold" style={{ fontSize: 12, background: openT.status === s ? "var(--navy)" : "#F2F1F8", color: openT.status === s ? "#fff" : "var(--ink)" }}>{s}</button>)}

  );
}

function mgAnswer(q, role, warehouse, weights) {
  const R = MG_ROLES[role];
  const sc = R.scope || {};
  const s = q.toLowerCase();
  const now = new Date();
  const t = mgAgg(sod(now), now, sc);
  const m = mgAgg(new Date(now.getFullYear(), now.getMonth(), 1), now, sc);
  const has = (...w) => w.some((x) => s.includes(x));
  if (has("чист", "таза", "валов", "прибыл", "пайда", "себестоим", "p&l", "ebitda")) {
    if (R.fin !== "full") return "У вашей роли нет доступа к валовой и чистой прибыли. Эти данные видит только владелец.";
    return "За текущий месяц: выручка " + shortMoney(m.netRev) + ", валовая прибыль " + shortMoney(m.gross) + " (маржа " + fp(m.margin) + "), операционные расходы " + shortMoney(m.opex) + ", чистая прибыль " + shortMoney(m.net) + " (" + fp(m.netMargin) + ").";
  }
  if (has("марж")) {
    if (R.fin !== "full" && R.fin !== "margin") return "У вашей роли нет доступа к марже.";
    return "Маржа за текущий месяц — " + fp(m.margin) + ". Сегодня — " + fp(t.margin) + ".";
  }
  if (has("дебитор", "долг", "қарыз", "просроч")) {
    if (role === "driver" || role === "warehouse") return "Дебиторка для вашей роли недоступна.";
    const cl = MG.clients.filter((c) => (!sc.sv || c.sv === sc.sv) && (!sc.tp || c.tp === sc.tp));
    const worst = [...cl].sort((a, b) => b.overdue - a.overdue)[0];
    return "Дебиторка: " + shortMoney(cl.reduce((a, c) => a + c.debt, 0)) + ", просроченная " + shortMoney(cl.filter((c) => c.overdue > 0).reduce((a, c) => a + c.debt, 0)) + (worst && worst.overdue ? ". Самая большая просрочка — " + worst.name + ": " + worst.overdue + " дн., " + money(worst.debt) + "." : ".");
  }
  if (has("склад", "қойма", "остат", "заканч", "dead")) {
    if (["tp", "driver", "supervisor"].includes(role)) return "Складские данные для вашей роли недоступны.";
    const sv = stockView(warehouse);
    const low = sv.filter((p) => p.cover < 7).sort((a, b) => a.cover - b.cover).slice(0, 3);
    return "Заканчивается: " + (low.map((p) => p.name + " (" + p.cover + " дн.)").join(", ") || "нет") + ". Dead stock 30+ дней: " + sv.filter((p) => p.lastMove >= 30).length + " SKU.";
  }
  if (has("лучш", "рейтинг", "үздік", "score", "худш")) {
    if (role === "tp") return "Ваш Score за месяц: " + tpScore(MG.tpById[sc.tp], m, weights).score + ".";
    if (["driver", "warehouse", "accountant", "financier"].includes(role)) return "Рейтинг ТП для вашей роли недоступен.";
    const list = MG.tps.filter((x) => !sc.sv || x.sv === sc.sv).map((x) => ({ x, sc: tpScore(x, mgAgg(new Date(now.getFullYear(), now.getMonth(), 1), now, { tp: x.id }), weights).score })).sort((a, b) => b.sc - a.sc);
    return "Лучший ТП месяца — " + list[0].x.name + " (Score " + list[0].sc + "). Отстаёт — " + list[list.length - 1].x.name + " (Score " + list[list.length - 1].sc + ").";
  }
  if (has("план", "жоспар", "прогноз")) {
    if (["driver", "warehouse"].includes(role)) return "План продаж для вашей роли недоступен.";
    const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    return "План месяца выполнен на " + fp(m.planPct) + ". Прогноз на конец месяца — " + shortMoney(m.netRev / now.getDate() * dim) + ".";
  }
  if (has("продал", "продаж", "выручк", "сатыл", "сколько")) {
    if (["driver", "warehouse"].includes(role)) return "Данные о продажах для вашей роли недоступны.";
    return "Сегодня продано на " + shortMoney(t.netRev) + ", за месяц — " + shortMoney(m.netRev) + ". Возвраты за месяц: " + fp(m.retPct) + ".";
  }
  if (has("проблем", "мәселе", "вмешат")) {
    const p = mgProblems(role, warehouse).filter((x) => x.lvl === "red");
    return p.length ? "Критично сейчас: " + p.map((x) => x.text).join("; ") + "." : "Критичных проблем нет.";
  }
  return "Я могу ответить про продажи, план, маржу, прибыль, дебиторку, склад, рейтинг ТП и проблемы — в рамках прав вашей роли. Например: «Сколько продали сегодня?»";
}

function MgAI({ role, warehouse, weights }) {
  const [msgs, setMsgs] = useState([{ me: false, t: "Здравствуйте! Спросите о компании — отвечу по данным, доступным вашей роли." }]);
  const [q, setQ] = useState("");
  const ask = (text) => {
    const v = (text || q).trim(); if (!v) return;
    setMsgs((m) => [...m, { me: true, t: v }, { me: false, t: mgAnswer(v, role, warehouse, weights) }]);
    setQ("");
  };
  const quick = ["Сколько продали сегодня?", "Как выполняется план?", "Какая дебиторка?", "Кто лучший ТП?", "Что заканчивается на складе?", "Какая чистая прибыль?", "Где нужно вмешаться?"];
  return (
    <div>
      <div className="flex gap-1.5 overflow-x-auto pb-2 mb-2" style={{ scrollbarWidth: "none" }}>
        {quick.map((x) => <button key={x} onClick={() => ask(x)} className="shrink-0 px-3 py-1.5 rounded-full" style={{ fontSize: 11.5, background: "#EEF0FF", color: "var(--navy)", fontWeight: 600 }}>{x}</button>)}
      </div>
      {msgs.map((m, i) => (
        <div key={i} className="flex mb-2" style={{ justifyContent: m.me ? "flex-end" : "flex-start" }}>
          <div className="rounded-2xl px-3.5 py-2.5" style={{ maxWidth: "85%", background: m.me ? "var(--navy)" : "#fff", color: m.me ? "#fff" : "var(--ink)", border: m.me ? "none" : "1px solid var(--line)", fontSize: 13, lineHeight: 1.45 }}>{m.t}</div>
        </div>
      ))}
      <div className="flex gap-2 mt-3">
        <input value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === "Enter" && ask()} placeholder="Спросите что-нибудь…" className="flex-1 px-3.5 py-3 rounded-xl" style={{ border: "1.5px solid var(--line)", fontSize: 13, background: "#fff" }} />
        <button onClick={() => ask()} className="px-4 rounded-xl" style={{ background: "var(--navy)" }}><Ico name="send" size={16} color="#fff" /></button>
      </div>
      <p style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 8, lineHeight: 1.4 }}>Демо-ассистент отвечает по встроенным правилам. В рабочей версии AI подключается на сервере и проверяет права роли (RBAC) до ответа.</p>
    </div>
  );
}

        <GhostButton small onClick={() => { addAudit(R.person, "Экспорт отчёта", "PDF", "печать экрана"); window.print(); }}>PDF / печать</GhostButton>
      </div>
      <p style={{ fontSize: 10.5, color: "var(--muted)", marginBottom: 10 }}>В экспорт попадают только данные, разрешённые вашей роли.</p>
      <MgLabel>Журнал действий (audit log)</MgLabel>
      <MgCard>
        {auditLog.slice(0, 12).map((a, i) => (
          <div key={i} className="py-1.5" style={{ borderBottom: "1px dashed var(--line)" }}>
            <p style={{ fontSize: 12, fontWeight: 700 }}>{a.action} · <span style={{ fontWeight: 500 }}>{a.obj}</span></p>
            <p style={{ fontSize: 10.5, color: "var(--muted)" }}>{a.t} · {a.user} · {a.detail}</p>
          </div>
        ))}
      </MgCard>
      <MgLabel>Безопасность</MgLabel>
      <MgCard>
        {["HTTPS-соединение", "Пароли хранятся в виде хэша", "Права (RBAC) проверяются на сервере", "2FA для владельца и директора", "Контроль сессий и устройств", "Резервное копирование ежедневно"].map((x) => (
          <div key={x} className="flex items-center gap-2 py-1"><Ico name="check-circle" size={14} color="#127A33" /><span style={{ fontSize: 12.5 }}>{x}</span></div>
        ))}
        <p style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 6, lineHeight: 1.4 }}>Эти пункты выполняются на стороне Backend при подключении к серверу; в демо-версии они показаны как требования ТЗ.</p>
      </MgCard>
    </div>
  );
}

function MgmtApp({ role, shared, onExit, lang, setLang }) {
  const { warehouse, auditLog, addAudit, mgTasks, setMgTasks, mgWeights, setMgWeights, mgSync, setMgSync } = shared;
  const R = MG_ROLES[role];
  const [tab, setTab] = useState("home");
  const [tpOpen, setTpOpen] = useState(null);
  const [period, setPeriod] = useState("month");
  const [custom, setCustom] = useState({ from: addD(new Date(), -13).toISOString().slice(0, 10), to: new Date().toISOString().slice(0, 10) });
  const [toast, setToast] = useState(null);
  const [bell, setBell] = useState(false);
  const showToast = (m) => { setToast(m); setTimeout(() => setToast(null), 2200); };
  const rg = mgRange(period, custom);
  const scope = R.scope || {};
  const cur = useMemo(() => mgAgg(rg.from, rg.to, scope), [rg.from.getTime(), rg.to.getTime(), role]);
  const prev = useMemo(() => mgAgg(rg.pf, rg.pt, scope), [rg.pf.getTime(), rg.pt.getTime(), role]);
  const problems = mgProblems(role, warehouse);
  const stale = mgSync.fail || Date.now() - new Date(mgSync.sd).getTime() > 15 * 60000;
  const go = (t) => { setTpOpen(null); if (R.tabs.includes(t)) setTab(t); };
  const showPeriod = ["home", "sales", "finance"].includes(tab) && ["owner", "director", "accountant", "financier"].includes(role);
  const p = { role, cur, prev, rg, go, warehouse, problems, weights: mgWeights, addAudit, showToast, openTp: (id) => setTpOpen(id) };
  const title = tpOpen ? MG.tpById[tpOpen].name : MG_TABS[tab][1];
  return (
    <div className="relative h-full flex flex-col" style={{ background: "var(--bg)" }}>
      <StatusBar />
      <div className="px-5 pb-2 flex items-center gap-2">
        <div className="rounded-xl flex items-center justify-center shrink-0" style={{ width: 32, height: 32, background: "#fff", border: "1px solid var(--line)" }}><Logo size={24} /></div>
        <div className="flex-1 min-w-0">
          <p className="font-display truncate" style={{ fontSize: 13.5, fontWeight: 800, color: "var(--ink)" }}>{title}</p>
          <p className="truncate" style={{ fontSize: 10, color: "var(--muted)" }}>{R.person} · {R.label}</p>
        </div>
        <LangSwitch lang={lang} setLang={setLang} />
        <button onClick={() => setBell(true)} className="relative p-2 rounded-full" style={{ background: "#F2F1F8" }}>
          <Ico name="bell" size={16} />
          {problems.some((x) => x.lvl === "red") && <span className="absolute rounded-full" style={{ top: 4, right: 4, width: 8, height: 8, background: "var(--red)" }} />}
        </button>
        <button onClick={onExit} className="p-2 rounded-full" style={{ background: "#FCE7E6" }}><Ico name="log-out" size={15} color="var(--red)" /></button>
      </div>
      {stale && (
        <div className="rounded-xl px-3 py-2 flex items-center gap-2" style={{ background: "#FCE7E6", margin: "0 20px 8px" }}>
          <Ico name="clock" size={14} color="#B3261E" />
          <span style={{ fontSize: 11, color: "#B3261E", fontWeight: 600, flex: 1 }}>Данные могут быть устаревшими. Последнее обновление: {dt(new Date(mgSync.sd))}</span>
        </div>
      )}
      <div className="flex-1 overflow-y-auto pb-24 px-5 pt-1 font-body">
        {tpOpen ? (
          <>
            <button onClick={() => setTpOpen(null)} className="flex items-center gap-1 mb-3" style={{ fontSize: 12.5, color: "var(--navy)", fontWeight: 700 }}><Ico name="arrow-left" size={14} />Назад к команде</button>
            <MgTpCard {...p} tpId={tpOpen} />
          </>
        ) : (
          <>
            {showPeriod && <MgPeriodBar period={period} setPeriod={setPeriod} custom={custom} setCustom={setCustom} />}
            {tab === "home" && <MgHome {...p} />}
            {tab === "sales" && <MgSales {...p} />}
            {tab === "team" && <MgTeam {...p} />}
            {tab === "fleet" && <MgFleet {...p} />}
            {tab === "clients" && <MgClients {...p} />}
            {tab === "stock" && <MgStock {...p} />}
            {tab === "finance" && <MgFinance {...p} />}
            {tab === "problems" && <MgProblems {...p} />}
            {tab === "tasks" && <MgTasks {...p} tasks={mgTasks} setTasks={setMgTasks} />}
            {tab === "ai" && <MgAI {...p} />}
            {tab === "system" && <MgSystem {...p} sync={mgSync} setSync={setMgSync} setWeights={setMgWeights} auditLog={auditLog} />}
            <p className="text-center" style={{ fontSize: 10, color: "var(--muted)", marginTop: 14 }}>Демо-данные · подключение к 1С и Sales Doctor через Backend API</p>
          </>
        )}
      </div>
      <div className="absolute bottom-0 left-0 right-0 flex items-center gap-1 px-2 pt-2 overflow-x-auto" style={{ background: "#fff", borderTop: "1px solid var(--line)", scrollbarWidth: "none", paddingBottom: "calc(1.5rem + env(safe-area-inset-bottom, 0px))" }}>
        {R.tabs.map((id) => {
          const active = tab === id && !tpOpen;
          return (
            <button key={id} onClick={() => go(id)} className="flex flex-col items-center gap-1 shrink-0 px-2.5 py-1 rounded-xl" style={{ background: active ? "#EEF0FF" : "transparent", minWidth: 54 }}>
              <Ico name={MG_TABS[id][0]} size={18} color={active ? "var(--navy)" : "var(--muted)"} strokeWidth={active ? 2.4 : 2} />
              <span style={{ fontSize: 9, color: active ? "var(--navy)" : "var(--muted)", fontWeight: active ? 700 : 500, whiteSpace: "nowrap" }}>{MG_TABS[id][1]}</span>
            </button>
          );
        })}
      </div>
      {bell && (
        <Modal title="Уведомления" onClose={() => setBell(false)}>
          {problems.filter((x) => x.lvl !== "green").map((x, i) => <MgProblemRow key={i} p={x} onGo={(t) => { setBell(false); go(t); }} />)}
          {problems.filter((x) => x.lvl !== "green").length === 0 && <p style={{ fontSize: 12.5, color: "var(--muted)" }}>Новых уведомлений нет</p>}
        </Modal>
      )}
      <Toast toast={toast} />
    </div>
  );
}

/* ============================== ROOT ============================== */

function App() {
  // view: "client" (customer-facing app) | "staffChoice" (hidden role picker, reached via
  // double‑tap on the logo) | "adminLogin" / "admin" (staff dashboard, admin/admin)
  // | "agentLogin" / "agent" (sales-rep dashboard, credentials issued by the admin)
  const [view, setView] = useState("client");
  const [loggedAgent, setLoggedAgent] = useState(null);
  const [lang, setLang] = useState(initialLang);
  useI18nDom(lang);
  const [mgRole, setMgRole] = useState(null);
  const [mgTasks, setMgTasks] = useState([
    { id: "T1", title: "Погасить просрочку «Минимаркет Айсулу»", who: "Азамат Турсунов", by: "Директор по продажам", deadline: new Date().toISOString().slice(0, 10), prio: "Высокий", status: "В работе", comments: [{ a: "Директор по продажам", t: "Договориться о графике оплаты до пятницы" }] },
    { id: "T2", title: "Провести инвентаризацию напитков", who: "Дамир — завсклад", by: "Сапар — владелец", deadline: new Date(Date.now() + 2 * 86400000).toISOString().slice(0, 10), prio: "Средний", status: "Новая", comments: [] },
  ]);
  const [mgWeights, setMgWeights] = useState(DEFAULT_WEIGHTS);
  const [mgSync, setMgSync] = useState({ c1: new Date(Date.now() - 4 * 60000), sd: new Date(Date.now() - 2 * 60000), fail: false, log: [
    { t: new Date(Date.now() - 2 * 60000), src: "Sales Doctor", ok: true }, { t: new Date(Date.now() - 4 * 60000), src: "1С", ok: true }] });

  const [profile, setProfile] = useState({ name: "", hasShop: false, shopName: "" });
  const [cart, setCart] = useState({});
  const [orders, setOrders] = useState(genOrders());
  const [banners, setBanners] = useState(BANNER_SEED);
  const [warehouse, setWarehouse] = useState(PRODUCTS);
  const [stories, setStories] = useState(STORY_SEED);
  const [accounts, setAccounts] = useState(ACCOUNTS_SEED);
  const [auditLog, setAuditLog] = useState(AUDIT_SEED);
  const [pushLog, setPushLog] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [cashback, setCashback] = useState({ threshold: 50000, reward: 5000 });
  const [bonusRedeemedMonth, setBonusRedeemedMonth] = useState(null);
  const [agents, setAgents] = useState(AGENTS_SEED);
  const [agentStores, setAgentStores] = useState([]);
  const [shift, setShift] = useState(null);            // null = смена закрыта
  const [shiftHistory, setShiftHistory] = useState([]);
  const [directorPhone, setDirectorPhone] = useState(DIRECTOR_PHONE_DEFAULT);

  const addAudit = (user, action, obj, detail) => {
    setAuditLog((prev) => [{ t: "только что", user, action, obj, detail }, ...prev]);
  };
  const clientNotify = (text) => {
    setNotifications((prev) => [{ text, time: new Date().toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }), read: false }, ...prev]);
  };

  const shared = {
    profile, setProfile, cart, setCart, orders, setOrders, banners, setBanners,
    warehouse, setWarehouse, stories, setStories, accounts, setAccounts,
    auditLog, addAudit, pushLog, setPushLog, notifications, setNotifications, clientNotify,
    cashback, setCashback, bonusRedeemedMonth, setBonusRedeemedMonth,
    agents, setAgents, agentStores, setAgentStores,
    mgTasks, setMgTasks, mgWeights, setMgWeights, mgSync, setMgSync,
    shift, setShift, shiftHistory, setShiftHistory, directorPhone, setDirectorPhone,
  };

  return (
    <LangCtx.Provider value={{ lang, setLang }}>
    <div className="kz-root" style={{ height: "100dvh", width: "100%", overflow: "hidden", position: "relative", background: "var(--bg)" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        .kz-root { --navy:#1B1464; --red:#E2231A; --yellow:#FFC800; --bg:#F6F5FA; --ink:#161327; --muted:#77748C; --line:#E7E5F0; }
        .kz-root, .kz-root input, .kz-root textarea, .kz-root button { font-family: 'Manrope', sans-serif; }
        .font-display { font-family: 'Unbounded', sans-serif; }
        .font-mono-kz { font-family: 'JetBrains Mono', monospace; }
        .kz-root ::-webkit-scrollbar { display: none; }
      `}</style>

      <div className="relative h-full w-full" style={{ maxWidth: 520, margin: "0 auto", background: "#fff" }}>
        {view === "client" && <ClientApp shared={shared} onAdminTrigger={() => setView("staffChoice")} />}
        {view === "staffChoice" && <StaffGate onCancel={() => setView("client")} onPick={(role) => setView(role === "admin" ? "adminLogin" : role === "mgmt" ? "mgmtLogin" : "agentLogin")} />}
        {view === "mgmtLogin" && <MgmtLogin addAudit={addAudit} onCancel={() => setView("staffChoice")} onSuccess={(r) => { setMgRole(r); setView("mgmt"); }} />}
        {view === "mgmt" && mgRole && <MgmtApp role={mgRole} shared={shared} onExit={() => { addAudit(MG_ROLES[mgRole].person, "Выход из системы", MG_ROLES[mgRole].label, ""); setMgRole(null); setView("client"); }} />}
        {view === "adminLogin" && <AdminLogin onCancel={() => setView("staffChoice")} onSuccess={() => setView("admin")} />}
        {view === "admin" && <AdminApp shared={shared} onExit={() => setView("client")} />}
        {view === "agentLogin" && <AgentLogin agents={agents} onCancel={() => setView("staffChoice")} onSuccess={(ag) => { setLoggedAgent(ag); setView("agent"); }} />}
        {view === "agent" && loggedAgent && <AgentApp agent={loggedAgent} shared={shared} onExit={() => { setLoggedAgent(null); setView("client"); }} />}
      </div>
    </div>
    </LangCtx.Provider>
  );
}


const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);


</script>
