/* =====================================================================
   Sapar Trade — адаптивная раскладка
   Телефон  < 768 px   : как было (колонка 520 px, меню снизу)
   Планшет  768–1199   : колонка до 960 px, сетки шире, меню снизу, окна по центру
   Компьютер ≥ 1200 px : на всю ширину, меню слева 248 px, контент до 1320 px
   Классы: .kz-frame (корень), .kz-app (режим), .kz-main (контент), .kz-nav* (меню),
           .kz-modal / .kz-modal-box (окна), .kz-narrow (формы входа),
           .kz-list (списки карточек), .kz-split (карта + список)
   ===================================================================== */

/* ---------- Корневой контейнер ---------- */
.kz-frame { max-width: 520px; margin: 0 auto; background: #fff; }

/* ---------- Меню: телефон (по умолчанию) ---------- */
.kz-nav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; align-items: center; gap: 4px;
  padding: 8px 8px calc(1.5rem + env(safe-area-inset-bottom, 0px));
  background: #fff; border-top: 1px solid var(--line);
  overflow-x: auto; scrollbar-width: none;
}
.kz-nav::-webkit-scrollbar { display: none; }
.kz-nav--spread { justify-content: space-around; }
.kz-nav-brand { display: none; }
.kz-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0;
  min-width: 54px; padding: 4px 10px; border-radius: 12px;
  color: var(--muted); font-family: 'Manrope', sans-serif; font-size: 9.5px; font-weight: 500; white-space: nowrap;
}
.kz-nav-item.is-active { background: #EEF0FF; color: var(--navy); font-weight: 700; }
.kz-nav-icon { position: relative; display: inline-flex; }
.kz-nav-badge {
  position: absolute; top: -5px; right: -8px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 99px;
  background: var(--red); color: #fff; font-size: 8.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.kz-nav-extra { display: flex; align-items: center; margin-top: -1.75rem; }

/* ---------- Планшет и шире ---------- */
@media (min-width: 768px) {
  .kz-frame { max-width: 960px; box-shadow: 0 0 0 1px var(--line); }

  .kz-main .grid.grid-cols-2 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .kz-modal .grid.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kz-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; align-items: start; }
  .kz-list.gap-2\.5 { gap: 10px 14px; }

  .kz-modal { align-items: center !important; justify-content: center; padding: 24px; }
  .kz-modal-box { max-width: 560px; border-radius: 24px !important; box-shadow: 0 25px 50px rgba(0,0,0,.22); }

  .kz-narrow { max-width: 460px; width: 100%; margin-left: auto; margin-right: auto; justify-content: center; }
  .kz-narrow .mt-auto { margin-top: 24px; }
  /* центрируем пункты меню, но так, чтобы при прокрутке они не обрезались слева */
  .kz-nav:not(.kz-nav--spread) > :first-child { margin-left: auto; }
  .kz-nav:not(.kz-nav--spread) > :last-child { margin-right: auto; }
  .kz-nav-item { font-size: 10.5px; padding: 5px 14px; }
}

/* ---------- Компьютер ---------- */
@media (min-width: 1200px) {
  .kz-frame { max-width: none; box-shadow: none; }

  .kz-app { padding-left: 248px; }
  .kz-nav {
    top: 0; bottom: 0; right: auto; width: 248px;
    flex-direction: column; align-items: stretch; justify-content: flex-start;
    gap: 2px; padding: 18px 14px; border-top: none; border-right: 1px solid var(--line);
    overflow-x: hidden; overflow-y: auto;
  }
  .kz-nav:not(.kz-nav--spread) > :first-child, .kz-nav:not(.kz-nav--spread) > :last-child { margin-left: 0; margin-right: 0; }
  .kz-nav-brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 18px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
  .kz-nav-item { flex-direction: row; justify-content: flex-start; gap: 12px; min-width: 0; padding: 10px 12px; font-size: 14px; }
  .kz-nav-item:hover:not(.is-active) { background: #F6F5FA; color: var(--ink); }
  .kz-nav-extra { display: none; }

  .kz-app .kz-main { padding-bottom: 40px; }
  .kz-app .kz-head > .rounded-xl:first-child { display: none; } /* логотип уже есть в боковом меню */
  .kz-stale { max-width: 1320px; }
  .kz-main > * { max-width: 1320px; margin-left: auto; margin-right: auto; }
  .kz-head { max-width: 1320px; width: 100%; margin-left: auto; margin-right: auto; }

  .kz-main .grid.grid-cols-2 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .kz-main .grid.grid-cols-3 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .kz-modal .grid.grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kz-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 14px; }

  .kz-split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
  .kz-split-side { max-height: calc(100vh - 140px); overflow-y: auto; padding-right: 4px; }

  .kz-cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; align-items: start; }
}

</style>

  const timerRef = useRef(null);

    const now = Date.now();

      clearTimeout(timerRef.current);
