/* ---------- Double-tap helper: single tap fires onSingle, quick second tap fires onSecret ---------- */
function useDoubleTap(onSecret, onSingle, delay = 380) {
  const lastRef = useRef(0);
  const timerRef = useRef(null);
  return () => {
    const now = Date.now();
    if (now - lastRef.current < delay) {
      clearTimeout(timerRef.current);
      lastRef.current = 0;
      onSecret && onSecret();
    } else {
      lastRef.current = now;
      timerRef.current = setTimeout(() => { if (onSingle) onSingle(); }, delay);
    }
  };
}

/* ---------- Hand-rolled charts (no external chart library needed) ---------- */
function MiniLineChart({ data, xKey, yKey, color = "#1B1464" }) {
  const vals = data.map((d) => d[yKey]);
  const max = Math.max(...vals), min = Math.min(...vals);
  const W = 300, H = 110, pad = 8;
  const pts = data.map((d, i) => {
    const x = data.length > 1 ? (i / (data.length - 1)) * (W - pad * 2) + pad : W / 2;
    const y = H - pad - ((d[yKey] - min) / (max - min || 1)) * (H - pad * 2);
    return [x, y];
  });
  const poly = pts.map((p) => p.join(",")).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="110" preserveAspectRatio="none">
        <polyline points={poly} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color} />)}
      </svg>
      <div className="flex justify-between px-1">
        {data.map((d, i) => <span key={i} className="font-mono-kz" style={{ fontSize: 9, color: "var(--muted)" }}>{d[xKey]}</span>)}
      </div>
    </div>
  );
}
function MiniBarChart({ data, labelKey, valueKey, color = "#E2231A" }) {
  const max = Math.max(...data.map((d) => d[valueKey]), 1);
  return (
    <div className="flex items-end gap-2" style={{ height: 120 }}>
      {data.map((d, i) => (
        <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
          <div style={{ width: "100%", maxWidth: 22, height: `${(d[valueKey] / max) * 90}%`, background: color, borderRadius: "6px 6px 0 0", minHeight: 3 }} />
          <span className="font-mono-kz" style={{ fontSize: 7.5, color: "var(--muted)", marginTop: 4, textAlign: "center", lineHeight: 1.1 }}>{d[labelKey]}</span>
        </div>
      ))}
    </div>
  );
}

function genOrders() {
  const now = new Date();
  const mk = (idx, dayOffset, hour, name, shop, items, isDebt, status, type) => {
    const d = new Date(now);
    d.setDate(d.getDate() - dayOffset);
    d.setHours(hour, (idx * 13) % 60, 0, 0);
    const total = items.reduce((s, it) => s + it.price * it.qty, 0);
    return {
      id: `KZ-${String(2600 + dayOffset).slice(1)}${String(1000 + idx)}`,
      date: d,

/* ============================== LANGUAGE: RU / ҚАЗ ============================== */
// Весь интерфейс пишется на русском, а казахский включается переводчиком поверх DOM:
// словарь KK_DICT (русская фраза → казахская) применяется к видимому тексту и
// placeholder-ам. Оригинал хранится, поэтому переключение обратно на RU мгновенное.
let CUR_LANG = "ru";
const LangCtx = React.createContext({ lang: "ru", setLang: () => {} });

const KK_LETTERS = "А-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі";
let KK_RE = null;
function kkRegex() {
  if (KK_RE) return KK_RE;
  const keys = Object.keys(KK_DICT).filter((k) => k.length >= 1 && KK_DICT[k] !== undefined).sort((a, b) => b.length - a.length);
  const esc = keys.map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  KK_RE = new RegExp("(?<![" + KK_LETTERS + "])(" + esc.join("|") + ")(?![" + KK_LETTERS + "])", "g");
  return KK_RE;
}
function trKK(s) {
  if (!s || !/[А-Яа-яЁё]/.test(s)) return s;
  const t = s.trim();
  if (KK_DICT[t]) return s.replace(t, KK_DICT[t]);
  return s.replace(kkRegex(), (m) => (m in KK_DICT ? KK_DICT[m] : m));
}

const I18N_ORIG = new WeakMap();   // text node -> original russian text
const I18N_SET = new WeakMap();    // text node -> value we last wrote
const I18N_ATTR = new WeakMap();   // element -> { attr: [orig, set] }
function i18nApply(root, lang) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const p = n.parentNode;
    if (!p || p.nodeName === "SCRIPT" || p.nodeName === "STYLE" || p.nodeName === "TEXTAREA") continue;
    const v = n.nodeValue;
    const changedByApp = I18N_SET.get(n) !== v;
    if (changedByApp) I18N_ORIG.set(n, v);
    const orig = I18N_ORIG.get(n);
    const want = lang === "kk" ? trKK(orig) : orig;
    if (want !== v) n.nodeValue = want;
    I18N_SET.set(n, want);
  }
  root.querySelectorAll("[placeholder],[title],[aria-label]").forEach((el) => {
    const rec = I18N_ATTR.get(el) || {};
    ["placeholder", "title", "aria-label"].forEach((a) => {
      if (!el.hasAttribute(a)) return;
      const v = el.getAttribute(a);
      if (!rec[a] || rec[a][1] !== v) rec[a] = [v, v];
      const want = lang === "kk" ? trKK(rec[a][0]) : rec[a][0];
      if (want !== v) el.setAttribute(a, want);
      rec[a][1] = want;
    });
    I18N_ATTR.set(el, rec);
  });
}

function useI18nDom(lang) {
  useEffect(() => {
    CUR_LANG = lang;
    document.documentElement.lang = lang === "kk" ? "kk" : "ru";
    try { localStorage.setItem("sapar_lang", lang); } catch (e) {}
    const root = document.getElementById("root");
    i18nApply(root, lang);
    let raf = 0;
    const obs = new MutationObserver(() => {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; i18nApply(root, lang); });
    });
    obs.observe(root, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ["placeholder", "title", "aria-label"] });
    return () => { obs.disconnect(); if (raf) cancelAnimationFrame(raf); };
  }, [lang]);
}

function initialLang() {
  try { const v = localStorage.getItem("sapar_lang"); if (v === "kk" || v === "ru") return v; } catch (e) {}
  return "ru";
}

function LangSwitch({ light }) {
  const { lang, setLang } = React.useContext(LangCtx);
  return (
    <div className="flex items-center rounded-full p-toggle shrink-0" style={{ background: light ? "rgba(255,255,255,.18)" : "#F2F1F8" }}>
      {[["ru", "RU"], ["kk", "ҚАЗ"]].map(([id, l]) => (
        <button key={id} onClick={() => setLang(id)} className="rounded-full font-bold"
          style={{ fontSize: 10.5, padding: "4px 8px", background: lang === id ? "var(--navy)" : "transparent", color: lang === id ? "#fff" : (light ? "#fff" : "var(--ink)") }}>{l}</button>
      ))}
    </div>
  );
}

/* ---------- Work shift: report engine ---------- */
// The admin opens a shift ("Начать работу") and closes it ("Завершить работу").
// Everything that happened between those two timestamps is rolled up into one
// report: orders by channel, revenue, money actually taken into the till split
// by payment method, unpaid debt, top products and low-stock warnings.

const DIRECTOR_PHONE_DEFAULT = "+7 700 105 17 17";
const digitsOnly = (s) => String(s || "").replace(/\D/g, "");

const shiftDuration = (from, to) => {
  const mins = Math.max(0, Math.round((to - from) / 60000));
  const h = Math.floor(mins / 60), m = mins % 60;
  return (h ? h + " ч " : "") + m + " мин";
};

function buildShiftReport(orders, warehouse, from, to, adminName) {
  const inShift = orders.filter((o) => {
    const d = new Date(o.date);
    return d >= from && d <= to;
  });
  const cancelled = inShift.filter((o) => o.status === "Отменён");
  const live = inShift.filter((o) => o.status !== "Отменён");

  const sum = (arr) => arr.reduce((s, o) => s + o.total, 0);
  const payOf = (o) => o.isDebt ? "debt" : (o.payMethod || "cash");

  const cash = sum(live.filter((o) => payOf(o) === "cash"));
  const card = sum(live.filter((o) => payOf(o) === "card"));
  const transfer = sum(live.filter((o) => payOf(o) === "transfer"));
  const debt = sum(live.filter((o) => payOf(o) === "debt"));
  const revenue = sum(live);
  const till = cash + card + transfer;

  // top products by revenue inside the shift
  const map = {};
  live.forEach((o) => o.items.forEach((it) => {
    if (!map[it.n]) map[it.n] = { n: it.n, qty: 0, sum: 0 };
    map[it.n].qty += it.qty;
    map[it.n].sum += it.price * it.qty;
  }));
  const top = Object.values(map).sort((a, b) => b.sum - a.sum).slice(0, 5);

  const lowStock = (warehouse || []).filter((p) => p.stock <= 30).slice(0, 6);

  return {
    from, to, adminName,
    duration: shiftDuration(from, to),
    countAll: inShift.length,
    countShops: live.filter((o) => o.type === "shop").length,
    countIndividuals: live.filter((o) => o.type === "individual").length,
    countAgents: live.filter((o) => o.type === "agent").length,
    countCancelled: cancelled.length,
    revenue, cash, card, transfer, debt, till,
    avgCheck: live.length ? Math.round(revenue / live.length) : 0,
    top, lowStock,
    delivered: live.filter((o) => o.status === "Доставлен").length,
    inWork: live.filter((o) => o.status === "Новый" || o.status === "В обработке" || o.status === "Готов к выдаче").length,
  };
}

// Plain-text version of the report — this is the exact message the director
// receives in WhatsApp.
function reportToText(r) {
  const L = [];
  L.push("*ОТЧЁТ ЗА СМЕНУ — ИП «Sapar Trade»*");
  L.push("Дата: " + dmy(r.from));
  L.push("Смена: " + hm(r.from) + " — " + hm(r.to) + "  (" + r.duration + ")");
  L.push("Администратор: " + r.adminName);
  L.push("");
  L.push("🧾 *ЗАКАЗЫ: " + r.countAll + "*");
  L.push("• Магазины: " + r.countShops);
  L.push("• Частные лица: " + r.countIndividuals);
  L.push("• От представителей: " + r.countAgents);
  L.push("• Выдано/доставлено: " + r.delivered);
  L.push("• В работе: " + r.inWork);
  L.push("• Отменено: " + r.countCancelled);
  L.push("");
  L.push("💰 *ПРОДАЖИ*");
  L.push("Сумма продаж: " + money(r.revenue));
  L.push("Средний чек: " + money(r.avgCheck));
  L.push("");
  L.push("🏦 *КАССА*");
  L.push("Наличные: " + money(r.cash));
  L.push("Картой: " + money(r.card));
  L.push("Перевод: " + money(r.transfer));
  L.push("*ИТОГО В КАССУ: " + money(r.till) + "*");
  L.push("Отпущено в долг: " + money(r.debt));
  if (r.top.length) {
    L.push("");
    L.push("📦 *ТОП ТОВАРОВ*");
    r.top.forEach((t, i) => L.push((i + 1) + ". " + t.n + " — " + t.qty + " шт · " + money(t.sum)));
  }
  if (r.lowStock.length) {
    L.push("");
    L.push("⚠️ *ЗАКАНЧИВАЕТСЯ НА СКЛАДЕ*");
    r.lowStock.forEach((p) => L.push("• " + p.name + " — остаток " + p.stock + " " + p.unit));
  }
  L.push("");
  L.push("Отчёт сформирован автоматически: " + dt(r.to));
  return L.join("\n");
}

/* ---------- Monthly cashback program helpers ---------- */
// Rule: once a client's own purchases in the current calendar month reach the
// threshold, they unlock one reward (a free-shopping cashback credit) that can
// be applied at checkout. Progress is derived from order dates, so it resets
// automatically at the start of every new month — no manual reset needed.
const monthKey = (d) => d.getFullYear() + "-" + d.getMonth();
const getMonthSpend = (orders, now = new Date()) => {
  const mk = monthKey(now);
  return orders
    .filter((o) => o.__client && o.status !== "Отменён" && monthKey(new Date(o.date)) === mk)
    .reduce((sum, o) => sum + o.total, 0);
};
const daysLeftInMonth = (now = new Date()) => {
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  return end.getDate() - now.getDate();
};

/* ---------- Monthly cashback progress card (shown on Home and in Settings) ---------- */
function CashbackCard({ monthSpend, cashback, available, compact }) {
  const { threshold, reward } = cashback;
  const pct = Math.min(100, Math.round((monthSpend / threshold) * 100));
  const earned = monthSpend >= threshold;
  const left = Math.max(0, threshold - monthSpend);
  const now = new Date();

  return (
    <div className={compact ? "rounded-2xl p-4 mb-5" : "rounded-2xl p-4"} style={{ background: "linear-gradient(135deg,#0F5457,#1F7A7E)" }}>
      <div className="flex items-center justify-between mb-2">
        <span className="flex items-center gap-1.5 text-white" style={{ fontSize: 12.5, fontWeight: 700 }}>
          <Ico name="dollar" size={13} color="#fff" />Кэшбэк за месяц
        </span>
        <span className="font-mono-kz" style={{ fontSize: 11, color: "rgba(255,255,255,0.75)" }}>
          до конца месяца {daysLeftInMonth(now)} дн.
        </span>
      </div>
      <div className="rounded-full overflow-hidden mb-2" style={{ height: 8, background: "rgba(255,255,255,0.25)" }}>
        <div style={{ width: pct + "%", height: "100%", background: "#FFC800", transition: "width .3s" }} />
      </div>
      <div className="flex items-center justify-between">
        <span className="font-mono-kz text-white" style={{ fontSize: 12 }}>{money(monthSpend)} из {money(threshold)}</span>
        <span className="font-mono-kz text-white" style={{ fontSize: 12, fontWeight: 700 }}>{pct}%</span>
      </div>
      <p className="text-white" style={{ fontSize: 12, marginTop: 8, opacity: 0.95, lineHeight: 1.4 }}>
        {available
          ? <>Поздравляем! Вам доступен кэшбэк <b>{money(reward)}</b> — спишите его при оформлении заказа в корзине.</>
          : earned
          ? <>Кэшбэк <b>{money(reward)}</b> за этот месяц уже использован. Новый порог откроется в следующем месяце.</>
          : <>Наберите покупок ещё на <b>{money(left)}</b> в этом месяце — и получите <b>{money(reward)}</b> кэшбэка на бесплатные покупки.</>}
      </p>
    </div>
  );
}

function StoryViewer({ stories, onClose, onFinish }) {
  const [idx, setIdx] = useState(0);
  const [progress, setProgress] = useState(0);
  const [paused, setPaused] = useState(false);
  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => {
      setProgress((p) => {
        if (p >= 100) {
          if (idx >= stories.length - 1) { clearInterval(t); onFinish(); return 100; }
          setIdx((i) => i + 1);
          return 0;
        }
        return p + 2;
      });
    }, 90);
    return () => clearInterval(t);
  }, [idx, paused]);

  const s = stories[idx];
  return (
    <div className="absolute inset-0 z-50 flex flex-col" style={{ background: s.grad }}
      onMouseDown={() => setPaused(true)} onMouseUp={() => setPaused(false)}>
      <div className="flex gap-1.5 px-3 pt-4">
        {stories.map((_, i) => (
          <div key={i} className="flex-1 rounded-full overflow-hidden" style={{ height: 3, background: "rgba(255,255,255,0.35)" }}>
            <div style={{ height: "100%", width: i < idx ? "100%" : i === idx ? progress + "%" : "0%", background: "#fff", transition: "width .05s linear" }} />
          </div>
        ))}
      </div>
      <div className="flex items-center justify-between px-4 pt-3">
        <div className="flex items-center gap-2">
          <div className="rounded-full flex items-center justify-center" style={{ width: 30, height: 30, background: "#fff" }}><Logo size={24} /></div>
          <div>
            <p className="font-body text-white font-bold" style={{ fontSize: 12.5 }}>Sapar Trade</p>
            <p className="font-body text-white" style={{ fontSize: 10.5, opacity: 0.8 }}>{s.hoursAgo} ч назад</p>
          </div>
        </div>
        <button onClick={onClose} className="p-1.5 rounded-full" style={{ background: "rgba(255,255,255,0.2)" }}><Ico name="x" size={18} color="#fff" /></button>
      </div>
      <div className="flex-1 flex items-end p-6">
        <p className="font-display text-white" style={{ fontSize: 21, fontWeight: 800, lineHeight: 1.3 }}>{s.caption}</p>
      </div>
      <div className="absolute inset-0 flex" style={{ zIndex: -1 }}>
        <div className="w-1/3 h-full" onClick={() => { if (idx > 0) { setIdx(idx - 1); setProgress(0); } }} />
        <div className="w-2/3 h-full" onClick={() => { if (idx < stories.length - 1) { setIdx(idx + 1); setProgress(0); } else onFinish(); }} />
      </div>
    </div>
  );
}

function ClientApp({ shared, onAdminTrigger }) {
  const { profile, setProfile, cart, setCart, orders, setOrders, banners, stories, notifications, setNotifications, addAudit,
    cashback, bonusRedeemedMonth, setBonusRedeemedMonth } = shared;
  const [authed, setAuthed] = useState(false);
  const [regStep, setRegStep] = useState(1);
  const [phone, setPhone] = useState("");
  const [otp, setOtp] = useState("");
  const [screen, setScreen] = useState("home");
  const [storyOpen, setStoryOpen] = useState(false);
  const [storiesViewed, setStoriesViewed] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (m) => { setToast(m); setTimeout(() => setToast(null), 2200); };
  const myOrders = orders.filter((o) => o.__client);
  const cartCount = Object.values(cart).reduce((a, b) => a + b, 0);

  const monthSpend = getMonthSpend(myOrders);
  const bonusEarned = monthSpend >= cashback.threshold;
  const bonusAvailable = bonusEarned && bonusRedeemedMonth !== monthKey(new Date());

  const checkout = (items, total, isDebt, payMethod, bonusUsed) => {
    const order = {
      id: "KZ-" + Math.floor(260000 + Math.random() * 9999),
      date: new Date(), name: profile.name, shop: profile.hasShop ? profile.shopName : null,
      items: items.map((it) => ({ n: it.p.name, price: it.p.price, qty: it.qty })),
      total, isDebt, status: "Новый", type: profile.hasShop ? "shop" : "individual", payMethod,
      phone: "+7 701 234 56 78", address: "г. Кызылорда, ул. Абая, 15", __client: true,
    };
    setOrders([order, ...orders]);
    setCart({});
    if (bonusUsed) setBonusRedeemedMonth(monthKey(new Date()));
    addAudit(profile.name + (isDebt ? " (в долг)" : ""), "Новый заказ", order.id,
      money(total) + (payMethod === "card" ? " · картой" : "") + (bonusUsed ? " · кэшбэк списан" : ""));
    showToast(isDebt ? "Заказ оформлен в долг ✓" : "Заказ оформлен ✓");
    setScreen("orders");
  };

  const logout = () => {
    setAuthed(false);
    setRegStep(1);
    setPhone("");
    setOtp("");
    setScreen("home");
  };

  if (!authed) {
    return (
      <div className="relative h-full" style={{ background: "var(--bg)" }}>
        <StatusBar />
        {regStep === 1 && <RegPhone phone={phone} setPhone={setPhone} onNext={() => setRegStep(2)} onToast={showToast} onAdminTrigger={onAdminTrigger} />}
        {regStep === 2 && <RegOtp otp={otp} setOtp={setOtp} onNext={() => setRegStep(3)} onBack={() => setRegStep(1)} />}
        {regStep === 3 && <RegProfile profile={profile} setProfile={setProfile} onFinish={() => setAuthed(true)} />}
        <Toast toast={toast} />
      </div>
    );
  }

  return (
    <div className="relative h-full flex flex-col" style={{ background: "var(--bg)" }}>
      <StatusBar />
      <div className="flex-1 overflow-y-auto pb-24">
        {screen === "home" && <ClientHome profile={profile} cart={cart} setCart={setCart} banners={banners} stories={stories}
          storiesViewed={storiesViewed} onOpenStories={() => setStoryOpen(true)}
          notifications={notifications} onOpenNotifs={() => setNotifOpen(true)}
          monthSpend={monthSpend} cashback={cashback} bonusAvailable={bonusAvailable} />}
        {screen === "cart" && <ClientCart cart={cart} setCart={setCart} profile={profile} onCheckout={checkout} cashback={cashback} bonusAvailable={bonusAvailable} />}
        {screen === "orders" && <ClientOrders orders={myOrders} />}
        {screen === "settings" && <ClientSettings profile={profile} setProfile={setProfile} monthSpend={monthSpend} cashback={cashback} bonusAvailable={bonusAvailable} onLogout={logout} />}
        {screen === "info" && <ClientInfo onBack={() => setScreen("home")} />}
      </div>
      {screen !== "info" && <ClientNav screen={screen} setScreen={setScreen} cartCount={cartCount} onAdminTrigger={onAdminTrigger} />}
      {storyOpen && <StoryViewer stories={stories} onClose={() => { setStoryOpen(false); setStoriesViewed(true); }} onFinish={() => { setStoryOpen(false); setStoriesViewed(true); }} />}
      {notifOpen && (
        <Modal title="Уведомления" onClose={() => { setNotifOpen(false); setNotifications(notifications.map((n) => ({ ...n, read: true }))); }}>
          {notifications.length === 0 ? (
            <p style={{ fontSize: 13, color: "var(--muted)" }}>Уведомлений пока нет</p>
          ) : notifications.map((n, i) => (
            <div key={i} className="py-3" style={{ borderBottom: "1px dashed var(--line)" }}>
              <p style={{ fontSize: 13, color: "var(--ink)" }}>{n.text}</p>
              <p style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 3 }}>{n.time}</p>
            </div>
          ))}
        </Modal>
      )}
      <Toast toast={toast} />
    </div>
  );
}

/* ---------- ADMIN: work shift (start / finish + auto report to director) ---------- */
function AdminShift({ shift, setShift, shiftHistory, setShiftHistory, orders, warehouse, directorPhone, addAudit, showToast }) {
  const ADMIN_NAME = "Гульмира";
  const [now, setNow] = useState(new Date());
  const [confirmOpen, setConfirmOpen] = useState(false);   // preview before closing
  const [doneReport, setDoneReport] = useState(null);      // report of the just-closed shift

  // live clock while the shift is running
  useEffect(() => {
    if (!shift) return;
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, [shift]);

  const liveReport = shift
    ? buildShiftReport(orders, warehouse, new Date(shift.startedAt), now, ADMIN_NAME)
    : null;

  const start = () => {
    const d = new Date();
    setShift({ startedAt: d, admin: ADMIN_NAME });
    addAudit("Админ (" + ADMIN_NAME + ")", "Начало смены", "Смена " + dmy(d), "открыта в " + hm(d));
    showToast("Смена открыта ✓");
  };

  const finish = () => {
    const to = new Date();
    const r = buildShiftReport(orders, warehouse, new Date(shift.startedAt), to, shift.admin || ADMIN_NAME);
    const text = reportToText(r);
    // send first (still inside the user's tap → no popup blocking), then close
    sendToWhatsApp(directorPhone, text);
    setShiftHistory([{ ...r, text }, ...shiftHistory].slice(0, 30));
    setShift(null);
    setConfirmOpen(false);
    setDoneReport({ ...r, text });
    addAudit("Админ (" + r.adminName + ")", "Завершение смены", "Смена " + dmy(r.from),
      "касса " + money(r.till) + " · отчёт отправлен директору " + directorPhone);
    showToast("Смена закрыта · отчёт отправлен ✓");
  };

  const copyReport = (text) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast("Отчёт скопирован ✓"), () => showToast("Не удалось скопировать"));
    } else showToast("Не удалось скопировать");
  };

  const last = shiftHistory[0];

  const Row = ({ label, value, strong, color }) => (
    <div className="flex justify-between py-1.5" style={{ borderBottom: "1px dashed var(--line)" }}>
      <span style={{ fontSize: 12.5, color: "var(--muted)" }}>{label}</span>
      <span className="font-mono-kz" style={{ fontSize: 13, fontWeight: strong ? 800 : 700, color: color || "var(--ink)" }}>{value}</span>
    </div>
  );

  const ReportBody = ({ r }) => (
    <div>
      <div className="rounded-xl p-3 mb-3" style={{ background: "#F6F5FA" }}>
        <p style={{ fontSize: 12, color: "var(--muted)" }}>{dmy(r.from)} · {hm(r.from)} — {hm(r.to)} · {r.duration}</p>
        <p style={{ fontSize: 12.5, fontWeight: 700, color: "var(--ink)" }}>Администратор: {r.adminName}</p>
      </div>
      <p style={{ fontSize: 11.5, color: "var(--muted)", fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 4 }}>Заказы</p>
      <Row label="Всего заказов" value={r.countAll} strong />
      <Row label="Магазины" value={r.countShops} />
      <Row label="Частные лица" value={r.countIndividuals} />
      <Row label="От представителей" value={r.countAgents} />
      <Row label="Выдано / доставлено" value={r.delivered} />
      <Row label="В работе" value={r.inWork} />
      <Row label="Отменено" value={r.countCancelled} color="var(--red)" />
      <p style={{ fontSize: 11.5, color: "var(--muted)", fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.4, margin: "12px 0 4px" }}>Продажи</p>
      <Row label="Сумма продаж" value={money(r.revenue)} strong />
      <Row label="Средний чек" value={money(r.avgCheck)} />
      <p style={{ fontSize: 11.5, color: "var(--muted)", fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.4, margin: "12px 0 4px" }}>Касса</p>
      <Row label="Наличные" value={money(r.cash)} />
      <Row label="Картой" value={money(r.card)} />
      <Row label="Перевод" value={money(r.transfer)} />
      <div className="flex justify-between items-center rounded-xl px-3 py-2.5 mt-2" style={{ background: "#E4F7E9" }}>
        <span style={{ fontSize: 12.5, fontWeight: 800, color: "#127A33" }}>ИТОГО В КАССУ</span>

          {r.top.map((t, i) => (
            <div key={i} className="flex justify-between py-1.5" style={{ borderBottom: "1px dashed var(--line)" }}>
              <span style={{ fontSize: 12.5 }}>{i + 1}. {t.n} × {t.qty}</span>
              <span className="font-mono-kz" style={{ fontSize: 12.5, fontWeight: 700 }}>{money(t.sum)}</span>
            </div>
          ))}
        </>
      )}
      {r.lowStock.length > 0 && (
        <>
          <p style={{ fontSize: 11.5, color: "var(--red)", fontWeight: 800, textTransform: "uppercase", letterSpacing: 0.4, margin: "14px 0 4px" }}>Заканчивается на складе</p>
          {r.lowStock.map((p) => (
            <div key={p.id} className="flex justify-between py-1.5" style={{ borderBottom: "1px dashed var(--line)" }}>

              <span className="font-mono-kz" style={{ fontSize: 12.5, fontWeight: 700, color: "var(--red)" }}>{p.stock} {p.unit}</span>
            </div>
          ))}
        </>
      )}
    </div>
  );

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Открытие и закрытие рабочего дня">Смена</SectionTitle>

      {!shift ? (
        <>
          <div className="rounded-2xl p-5 mb-4 text-center" style={{ background: "#fff", border: "1px solid var(--line)" }}>
            <div className="mx-auto rounded-full flex items-center justify-center mb-3" style={{ width: 76, height: 76, background: "#EEF0FF" }}>
              <Ico name="power" size={34} color="var(--navy)" strokeWidth={2.2} />
            </div>
            <p className="font-display" style={{ fontSize: 15, fontWeight: 800, color: "var(--ink)" }}>Смена закрыта</p>
            <p style={{ fontSize: 12, color: "var(--muted)", marginBottom: 14 }}>

            </p>
            <button onClick={start} className="w-full rounded-2xl py-4" style={{ background: "var(--navy)", color: "#fff" }}>

function AdminOrders({ orders, addAudit }) {
  const [tab, setTab] = useState("today");
  const [dateFilter, setDateFilter] = useState(new Date().toISOString().slice(0, 10));
  const [filter, setFilter] = useState("all");
  const [open, setOpen] = useState(null);

  const now = new Date();
  const list = orders.filter((o) => {
    if (tab === "today") { if (now - o.date > 24 * 3600 * 1000) return false; }
    else { if (o.date.toISOString().slice(0, 10) !== dateFilter) return false; }
    if (filter === "shops") return o.type === "shop";
    if (filter === "individuals") return o.type === "individual";
    if (filter === "agents") return o.type === "agent";
    if (filter === "debt") return o.isDebt;
    return true;
  });

  const typeLabel = (o) => o.type === "shop" ? "Магазин" : o.type === "agent" ? "Представитель: " + o.agentName : "Частное лицо";

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Заказы за 24 часа и полная история">Заказы</SectionTitle>
      <div className="flex gap-2 mb-3">
        <button onClick={() => setTab("today")} className="flex-1 rounded-xl py-2.5 font-semibold" style={{ fontSize: 12, background: tab === "today" ? "var(--navy)" : "#F2F1F8", color: tab === "today" ? "#fff" : "var(--ink)" }}>За 24 часа</button>
        <button onClick={() => setTab("history")} className="flex-1 rounded-xl py-2.5 font-semibold" style={{ fontSize: 12, background: tab === "history" ? "var(--navy)" : "#F2F1F8", color: tab === "history" ? "#fff" : "var(--ink)" }}>История по дате</button>
      </div>
      {tab === "history" && (
        <input type="date" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} className="font-mono-kz w-full mb-3 px-3 py-2.5 rounded-xl outline-none" style={{ border: "1px solid var(--line)", fontSize: 13 }} />
      )}
      <div className="flex gap-1.5 overflow-x-auto mb-3 pb-1" style={{ scrollbarWidth: "none" }}>
        {[["all", "Все"], ["shops", "Магазины"], ["individuals", "Частные лица"], ["agents", "От представителей"], ["debt", "Долги"]].map(([id, label]) => (
          <button key={id} onClick={() => setFilter(id)} className="shrink-0 px-3 py-1.5 rounded-full font-semibold" style={{ fontSize: 11.5, background: filter === id ? "var(--red)" : "#F2F1F8", color: filter === id ? "#fff" : "var(--ink)" }}>{label}</button>
        ))}
      </div>
      <p className="font-mono-kz mb-2" style={{ fontSize: 11, color: "var(--muted)" }}>Найдено: {list.length}</p>
      <div className="flex flex-col gap-2.5">
        {list.map((o) => {
          const st = STATUS_STYLE[o.status];
          return (
            <button key={o.id} onClick={() => setOpen(o)} className="text-left rounded-2xl p-3.5" style={{ background: "#fff", border: "1px solid var(--line)" }}>
              <div className="flex items-center justify-between mb-1">
                <span className="font-mono-kz" style={{ fontSize: 11.5, color: "var(--muted)" }}>{o.id}</span>
                <Badge bg={st.bg} fg={st.fg}>{o.status}</Badge>
              </div>
              <p style={{ fontSize: 13, color: "var(--ink)", fontWeight: 700 }}>{o.shop || o.name}</p>
              <div className="flex items-center justify-between mt-1">
                <span style={{ fontSize: 11, color: "var(--muted)" }}>{dt(o.date)}</span>
                <span className="font-mono-kz" style={{ fontSize: 13.5, fontWeight: 700, color: "var(--ink)" }}>{money(o.total)}</span>
              </div>
              <div className="flex gap-1.5 mt-1.5 flex-wrap">
                <Badge bg="#EEF0FF" fg="var(--navy)">{typeLabel(o)}</Badge>
                {o.isDebt && <Badge bg="#FFF6DE" fg="#8A5A00">Долг</Badge>}

      </div>

      {open && (
        <Modal title={open.id} onClose={() => setOpen(null)} wide>
          <BarcodeStrip />
          <div className="py-3">
            <div className="flex justify-between py-1" style={{ fontSize: 12.5 }}><span style={{ color: "var(--muted)" }}>Клиент</span><span style={{ fontWeight: 700 }}>{open.name}</span></div>
            {open.shop && <div className="flex justify-between py-1" style={{ fontSize: 12.5 }}><span style={{ color: "var(--muted)" }}>Магазин</span><span style={{ fontWeight: 700 }}>{open.shop}</span></div>}
            {open.type === "agent" && <div className="flex justify-between py-1" style={{ fontSize: 12.5 }}><span style={{ color: "var(--muted)" }}>Представитель</span><span style={{ fontWeight: 700 }}>{open.agentName}</span></div>}
            <div className="flex justify-between py-1" style={{ fontSize: 12.5 }}><span style={{ color: "var(--muted)" }}>Телефон</span><span className="font-mono-kz">{open.phone}</span></div>
            <div className="flex justify-between py-1" style={{ fontSize: 12.5 }}><span style={{ color: "var(--muted)" }}>Адрес</span><span>{open.address}</span></div>
            <div className="flex justify-between py-1" style={{ fontSize: 12.5 }}><span style={{ color: "var(--muted)" }}>Дата и время</span><span className="font-mono-kz">{dt(open.date)}</span></div>
            <div className="flex justify-between py-1" style={{ fontSize: 12.5 }}><span style={{ color: "var(--muted)" }}>Оплата</span><span>{open.isDebt ? "В долг" : open.payMethod === "transfer" ? "Перевод" : open.payMethod === "card" ? "Картой" : "Наличные"}</span></div>
          </div>
          <p style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, marginBottom: 6 }}>Состав заказа</p>
          {open.items.map((it, i) => (
            <div key={i} className="flex justify-between py-2" style={{ borderBottom: "1px dashed var(--line)", fontSize: 13 }}>
              <span>{it.n} × {it.qty}</span>
              <span className="font-mono-kz" style={{ fontWeight: 700 }}>{money(it.price * it.qty)}</span>
            </div>
          ))}
          <div className="flex justify-between pt-3 pb-4">
            <span style={{ fontWeight: 700 }}>Итого</span>
            <span className="font-mono-kz" style={{ fontWeight: 800, fontSize: 17 }}>{money(open.total)}</span>
          </div>
          <PrimaryButton full onClick={() => { addAudit("Админ (Гульмира)", "Экспорт PDF", open.id, "Скачан чек заказа"); }}>
            <span className="flex items-center justify-center gap-2"><Ico name="download" size={15} />Скачать PDF</span>
          </PrimaryButton>
        </Modal>
      )}
    </div>
  );
}

function AdminAds({ banners, setBanners, pushLog, setPushLog, addAudit, clientNotify }) {
  const [addOpen, setAddOpen] = useState(null); // {img}
  const [caption, setCaption] = useState("");
  const [subtitle, setSubtitle] = useState("");
  const [pushText, setPushText] = useState("");
  const fileRef = useRef(null);
  const galleryRef = useRef(null);
  const GRADS = ["linear-gradient(135deg,#1B1464,#3B2FA0)", "linear-gradient(135deg,#E2231A,#FF6A5B)", "linear-gradient(135deg,#FFC800,#FF9A00)", "linear-gradient(135deg,#161327,#4B3FCB)"];

  const pickFile = (e) => {
    const f = e.target.files[0];
    if (f) setAddOpen({ img: URL.createObjectURL(f) });
    else setAddOpen({ img: null });
  };

  const saveBanner = () => {
    const b = { id: "b" + Date.now(), title: caption || "Новая акция", subtitle, grad: GRADS[banners.length % GRADS.length], img: addOpen?.img || null };
    setBanners([...banners, b]);
    addAudit("Админ (Гульмира)", "Добавлен баннер", b.title, `слот ${banners.length + 1}/10`);
    setAddOpen(null); setCaption(""); setSubtitle("");
  };

  const sendPush = () => {
    if (!pushText.trim()) return;
    const entry = { text: pushText, time: new Date().toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) };
    setPushLog([entry, ...pushLog]);
    clientNotify(pushText);
    addAudit("Админ (Гульмира)", "Push-уведомление", "Все клиенты", pushText.slice(0, 40));
    setPushText("");
  };

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub={`${banners.length}/10 баннеров · показываются каруселью на главной`}>Реклама</SectionTitle>
      <div className="grid grid-cols-2 gap-2.5 mb-6">
        {banners.map((b) => (
          <div key={b.id} className="relative rounded-xl overflow-hidden" style={{ height: 84, background: b.grad }}>
            {b.img && <img src={b.img} className="absolute inset-0 w-full h-full object-cover" alt="" />}
            <div className="absolute inset-0 p-2 flex flex-col justify-end" style={{ background: "linear-gradient(0deg, rgba(0,0,0,0.5), transparent 60%)" }}>
              <p className="text-white font-bold" style={{ fontSize: 10.5, lineHeight: 1.2 }}>{b.title}</p>
            </div>
            <button onClick={() => setBanners(banners.filter((x) => x.id !== b.id))} className="absolute top-1.5 right-1.5 rounded-full p-1" style={{ background: "rgba(0,0,0,0.4)" }}>
              <Ico name="trash" size={11} color="#fff" />
            </button>
          </div>
        ))}
        {banners.length < 10 && (
          <button onClick={() => { setAddOpen({ img: null }); }} className="rounded-xl flex flex-col items-center justify-center gap-1" style={{ height: 84, border: "1.5px dashed var(--line)", color: "var(--navy)" }}>
            <Ico name="plus-circle" size={20} /><span style={{ fontSize: 10.5, fontWeight: 700 }}>Добавить баннер</span>
          </button>
        )}
      </div>

      <p className="mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Push-уведомление всем клиентам</p>
      <textarea value={pushText} onChange={(e) => setPushText(e.target.value)} placeholder="Например: Завтра склад работает до 15:00"
        rows={3} className="w-full px-3.5 py-3 rounded-xl outline-none mb-2.5" style={{ border: "1.5px solid var(--line)", fontSize: 13.5, resize: "none" }} />
      <div className="mb-5"><PrimaryButton onClick={sendPush}><span className="flex items-center gap-2"><Ico name="send" size={14} />Отправить</span></PrimaryButton></div>

      {pushLog.length > 0 && (
        <>
          <p className="mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Последние отправленные</p>
          <div className="flex flex-col gap-2">
            {pushLog.slice(0, 5).map((p, i) => (
              <div key={i} className="rounded-xl p-3" style={{ border: "1px solid var(--line)" }}>
                <p style={{ fontSize: 12.5 }}>{p.text}</p>
                <p className="font-mono-kz" style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 3 }}>{p.time}</p>
              </div>
            ))}
          </div>
        </>
      )}

      {addOpen !== null && (
        <Modal title="Новый баннер" onClose={() => setAddOpen(null)}>
          <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={pickFile} />
          <input ref={galleryRef} type="file" accept="image/*" className="hidden" onChange={pickFile} />
          {addOpen.img ? (
            <img src={addOpen.img} className="w-full h-32 object-cover rounded-xl mb-3" alt="" />
          ) : (
            <div className="flex gap-2 mb-3">
              <GhostButton onClick={() => fileRef.current.click()}><span className="flex items-center gap-1.5"><Ico name="camera" size={14} />Камера</span></GhostButton>
              <GhostButton onClick={() => galleryRef.current.click()}><span className="flex items-center gap-1.5"><Ico name="image" size={14} />Галерея</span></GhostButton>
            </div>
          )}
          <Field label="Заголовок" placeholder="Скидка −10% на напитки" value={caption} onChange={(e) => setCaption(e.target.value)} />
          <Field label="Подзаголовок" placeholder="При заказе от 50 000 ₸" value={subtitle} onChange={(e) => setSubtitle(e.target.value)} />
          <PrimaryButton full onClick={saveBanner}>Сохранить баннер</PrimaryButton>
        </Modal>
      )}
    </div>
  );
}

function AdminWarehouse({ warehouse, setWarehouse, addAudit }) {
  const [q, setQ] = useState("");
  const [incoming, setIncoming] = useState(null); // product id
  const [amount, setAmount] = useState("");
  const filtered = warehouse.filter((p) => p.name.toLowerCase().includes(q.toLowerCase()));

  const applyIncoming = () => {
    const n = parseInt(amount, 10);
    if (!n) return;
    setWarehouse(warehouse.map((p) => p.id === incoming ? { ...p, stock: p.stock + n } : p));
    const prod = warehouse.find((p) => p.id === incoming);
    addAudit("Склад (Дамир)", "Приход товара", prod.name, `+${n} ${prod.unit}`);
    setIncoming(null); setAmount("");
  };

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Остатки на складе и приход товара">Склад</SectionTitle>
      <div className="relative mb-4">
        <Ico name="search" size={16} style={{ position: "absolute", left: 13, top: 13 }} color="var(--muted)" />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Найти товар..."
          className="w-full pl-9 pr-3 py-3 rounded-xl outline-none" style={{ background: "#F2F1F8", fontSize: 13.5 }} />
      </div>
      <div className="flex flex-col gap-2">
        {filtered.map((p) => (
          <div key={p.id} className="flex items-center gap-3 rounded-xl p-3" style={{ border: "1px solid var(--line)" }}>
            <div className="rounded-lg flex items-center justify-center shrink-0" style={{ width: 38, height: 38, background: "#F2F1F8", fontSize: 17 }}>
              {CATEGORIES.find((c) => c.id === p.cat)?.emoji}
            </div>
            <div className="flex-1 min-w-0">
              <p className="truncate" style={{ fontSize: 12.5, color: "var(--ink)", fontWeight: 600 }}>{p.name}</p>
              <p className="font-mono-kz" style={{ fontSize: 11.5, color: p.stock < 10 ? "var(--red)" : "var(--muted)", fontWeight: p.stock < 10 ? 700 : 500 }}>
                Остаток: {p.stock} {p.unit}{p.stock < 10 ? " · мало!" : ""}
              </p>
            </div>
            <button onClick={() => setIncoming(p.id)} className="rounded-lg px-2.5 py-2 shrink-0 flex items-center gap-1" style={{ background: "#EEF0FF", color: "var(--navy)" }}>
              <Ico name="plus" size={12} /><span style={{ fontSize: 11, fontWeight: 700 }}>Приход</span>
            </button>
          </div>
        ))}
      </div>
      {incoming && (
        <Modal title="Приход товара" onClose={() => setIncoming(null)}>
          <p style={{ fontSize: 13, fontWeight: 700, marginBottom: 12 }}>{warehouse.find((p) => p.id === incoming)?.name}</p>
          <Field label="Количество" type="number" placeholder="0" value={amount} onChange={(e) => setAmount(e.target.value)} autoFocus />
          <PrimaryButton full onClick={applyIncoming}>Добавить на склад</PrimaryButton>
        </Modal>
      )}
    </div>
  );
}

function AdminStories({ stories, setStories, addAudit }) {
  const [addOpen, setAddOpen] = useState(false);
  const [media, setMedia] = useState(null);
  const [caption, setCaption] = useState("");
  const fileRef = useRef(null);
  const galleryRef = useRef(null);
  const [tick, setTick] = useState(0);
  useEffect(() => { const t = setInterval(() => setTick((v) => v + 1), 60000); return () => clearInterval(t); }, []);
  const GRADS = ["linear-gradient(160deg,#1B1464,#4B3FCB)", "linear-gradient(160deg,#E2231A,#FF7A6E)", "linear-gradient(160deg,#FFC800,#FF9A00)", "linear-gradient(160deg,#161327,#4B3FCB)"];

  const remaining = (s) => {
    const left = 24 - s.hoursAgo;
    if (left <= 0) return "истекает";
    const h = Math.floor(left), m = Math.round((left - h) * 60);
    return `осталось ${h}ч ${m}м`;
  };

  const publish = () => {
    const s = { id: "s" + Date.now(), caption: caption || "Новая история", grad: GRADS[stories.length % GRADS.length], views: 0, hoursAgo: 0, media };
    setStories([s, ...stories]);
    addAudit("Админ (Гульмира)", "Добавлена история", s.caption.slice(0, 30), media?.type === "video" ? "видео" : "фото");
    setAddOpen(false); setMedia(null); setCaption("");
  };

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Хранятся 24 часа, затем удаляются автоматически">Истории</SectionTitle>
      <div className="grid grid-cols-2 gap-2.5">
        <button onClick={() => setAddOpen(true)} className="rounded-xl flex flex-col items-center justify-center gap-1" style={{ height: 130, border: "1.5px dashed var(--line)", color: "var(--navy)" }}>
          <Ico name="plus-circle" size={22} /><span style={{ fontSize: 11, fontWeight: 700 }}>Добавить историю</span>
        </button>
        {stories.map((s) => (
          <div key={s.id} className="relative rounded-xl overflow-hidden flex flex-col justify-between p-2.5" style={{ height: 130, background: s.grad }}>
            {s.media?.type === "video" && <Ico name="video" size={14} color="#fff" style={{ position: "absolute", top: 8, left: 8 }} />}
            <button onClick={() => setStories(stories.filter((x) => x.id !== s.id))} className="self-end rounded-full p-1" style={{ background: "rgba(0,0,0,0.35)" }}>
              <Ico name="trash" size={11} color="#fff" />
            </button>
            <div>
              <p className="text-white" style={{ fontSize: 10.5, fontWeight: 700, lineHeight: 1.25, marginBottom: 4 }}>{s.caption}</p>
              <div className="flex items-center justify-between">
                <span className="flex items-center gap-1 text-white" style={{ fontSize: 10, opacity: 0.9 }}><Ico name="eye" size={10} />{s.views}</span>
                <span className="flex items-center gap-1 text-white" style={{ fontSize: 9, opacity: 0.85 }}><Ico name="clock" size={9} />{remaining(s)}</span>
              </div>
            </div>
          </div>
        ))}
      </div>

      {addOpen && (
        <Modal title="Новая история" onClose={() => setAddOpen(false)}>
          <input ref={fileRef} type="file" accept="image/*,video/*" capture="environment" className="hidden"
            onChange={(e) => { const f = e.target.files[0]; if (f) setMedia({ url: URL.createObjectURL(f), type: f.type.startsWith("video") ? "video" : "image" }); }} />
          <input ref={galleryRef} type="file" accept="image/*,video/*" className="hidden"
            onChange={(e) => { const f = e.target.files[0]; if (f) setMedia({ url: URL.createObjectURL(f), type: f.type.startsWith("video") ? "video" : "image" }); }} />
          {media ? (
            media.type === "video" ? (
              <div className="relative w-full h-40 rounded-xl mb-3 overflow-hidden" style={{ background: "#161327" }}>
                <video src={media.url} className="w-full h-full object-cover" muted />
                <Ico name="play" size={28} color="#fff" style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)" }} />
              </div>
            ) : (
              <img src={media.url} className="w-full h-40 object-cover rounded-xl mb-3" alt="" />
            )
          ) : (

function AdminCRM({ orders }) {
  const today = orders.filter((o) => (new Date() - o.date) < 24 * 3600 * 1000);
  const revenueToday = today.reduce((s, o) => s + o.total, 0);
  const avgCheck = today.length ? Math.round(revenueToday / today.length) : 0;

  const revByDay = useMemo(() => {
    const days = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
    const now = new Date();
    return Array.from({ length: 7 }).map((_, i) => {
      const d = new Date(now); d.setDate(d.getDate() - (6 - i));
      const sum = orders.filter((o) => o.date.toDateString() === d.toDateString()).reduce((s, o) => s + o.total, 0);
      return { day: days[d.getDay() === 0 ? 6 : d.getDay() - 1], sum: sum || Math.round(20000 + Math.random() * 60000) };
    });
  }, [orders]);

  const catStats = CATEGORIES.map((c) => ({ name: c.name, val: PRODUCTS.filter((p) => p.cat === c.id).reduce((s, p) => s + p.stock, 0) }));

  const kpis = [
    { label: "Выручка сегодня", value: money(revenueToday || 284500), icon: "dollar", color: "var(--navy)" },
    { label: "Заказов сегодня", value: today.length || 12, icon: "package", color: "var(--red)" },
    { label: "Средний чек", value: money(avgCheck || 23700), icon: "trending-up", color: "#8A5A00" },
    { label: "Новых клиентов", value: 6, icon: "users", color: "#127A33" },
  ];

  const bySource = [
    { label: "Магазины (представители)", val: orders.filter((o) => o.type === "agent").length },
    { label: "Магазины (клиенты)", val: orders.filter((o) => o.type === "shop").length },
    { label: "Частные лица", val: orders.filter((o) => o.type === "individual").length },
  ];

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Полная статистика продаж">CRM</SectionTitle>
      <div className="grid grid-cols-2 gap-2.5 mb-5">
        {kpis.map((k, i) => (
          <div key={i} className="rounded-2xl p-3.5" style={{ background: "#fff", border: "1px solid var(--line)" }}>
            <Ico name={k.icon} size={16} color={k.color} />
            <p className="font-mono-kz" style={{ fontSize: 16.5, fontWeight: 800, color: "var(--ink)", marginTop: 6 }}>{k.value}</p>
            <p style={{ fontSize: 10.5, color: "var(--muted)" }}>{k.label}</p>
          </div>
        ))}
      </div>

      <p className="mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase" }}>Выручка за 7 дней</p>
      <div className="rounded-2xl p-3 mb-5" style={{ background: "#fff", border: "1px solid var(--line)" }}>
        <MiniLineChart data={revByDay} xKey="day" yKey="sum" color="#1B1464" />
      </div>

      <p className="mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase" }}>Остатки по категориям</p>
      <div className="rounded-2xl p-3 mb-5" style={{ background: "#fff", border: "1px solid var(--line)" }}>
        <MiniBarChart data={catStats} labelKey="name" valueKey="val" color="#E2231A" />
      </div>

      <p className="mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase" }}>Заказы по источникам</p>
      <div className="rounded-2xl p-1" style={{ background: "#fff", border: "1px solid var(--line)" }}>
        {bySource.map((b, i) => (
          <div key={i} className="flex items-center justify-between px-3 py-2.5" style={{ borderBottom: i < bySource.length - 1 ? "1px solid var(--line)" : "none" }}>
            <span style={{ fontSize: 12.5, color: "var(--ink)" }}>{b.label}</span>
            <span className="font-mono-kz" style={{ fontSize: 12.5, fontWeight: 700, color: "var(--navy)" }}>{b.val}</span>

function AdminSettings({ accounts, setAccounts, addAudit, cashback, setCashback, directorPhone, setDirectorPhone }) {
  const update = (id, field, val) => setAccounts(accounts.map((a) => a.id === id ? { ...a, [field]: val } : a));
  const [threshold, setThreshold] = useState(String(cashback.threshold));
  const [reward, setReward] = useState(String(cashback.reward));
  const [dirPhone, setDirPhone] = useState(directorPhone);

  const saveDirector = () => {
    setDirectorPhone(dirPhone.trim());
    addAudit("Админ (Гульмира)", "Изменён номер директора", "Отчёт по смене", "WhatsApp → " + dirPhone.trim());
  };

  const saveCashback = () => {
    const t = Math.max(0, Number(threshold.replace(/\D/g, "")) || 0);
    const r = Math.max(0, Number(reward.replace(/\D/g, "")) || 0);
    setCashback({ threshold: t, reward: r });
    addAudit("Админ (Гульмира)", "Изменена бонусная программа", "Кэшбэк", `порог ${money(t)} → награда ${money(r)}`);
  };

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Отчёты, бонусы и реквизиты">Настройки</SectionTitle>

      <p className="font-body mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Отчёт по смене</p>
      <div className="rounded-2xl p-3.5 mb-4" style={{ background: "#fff", border: "1px solid var(--line)" }}>
        <Field label="WhatsApp директора" inputMode="tel" value={dirPhone} onChange={(e) => setDirPhone(e.target.value)} />
        <p style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.4 }}>
          На этот номер уходит полный отчёт, когда администратор нажимает «Завершить работу»: заказы, сумма продаж, деньги в кассе по видам оплаты, долги, топ товаров и остатки на складе.
        </p>
        <GhostButton small onClick={saveDirector}>Сохранить</GhostButton>
      </div>

      <p className="font-body mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Бонусная программа</p>
      <div className="rounded-2xl p-3.5 mb-4" style={{ background: "#fff", border: "1px solid var(--line)" }}>
        <Field label="Порог покупок за месяц, ₸" inputMode="numeric" value={threshold} onChange={(e) => setThreshold(e.target.value.replace(/\D/g, ""))} />
        <Field label="Награда (кэшбэк), ₸" inputMode="numeric" value={reward} onChange={(e) => setReward(e.target.value.replace(/\D/g, ""))} />
        <p style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 10, lineHeight: 1.4 }}>
          Когда сумма покупок клиента за календарный месяц достигает порога, ему становится доступен кэшбэк — списывается один раз в корзине. Счётчик обнуляется в начале каждого нового месяца.
        </p>
        <GhostButton small onClick={saveCashback}>Сохранить</GhostButton>

      <p className="font-body mb-2" style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Счета для зачисления онлайн-оплаты</p>

/* ---------- ADMIN: sales-rep (agent) accounts ---------- */
function AdminAgents({ agents, setAgents, orders, addAudit }) {
  const [addOpen, setAddOpen] = useState(false);
  const [name, setName] = useState("");
  const [login, setLogin] = useState("");
  const [password, setPassword] = useState("");

  const genLogin = () => "agent" + Math.floor(100 + Math.random() * 900);
  const genPassword = () => String(Math.floor(1000 + Math.random() * 9000));
  const openAdd = () => { setName(""); setLogin(genLogin()); setPassword(genPassword()); setAddOpen(true); };

  const save = () => {
    if (!name.trim() || !login.trim() || !password.trim()) return;
    const a = { id: "ag" + Date.now(), name: name.trim(), login: login.trim(), password: password.trim(), active: true };
    setAgents([...agents, a]);
    addAudit("Админ (Гульмира)", "Создан торговый представитель", a.name, `логин: ${a.login}`);
    setAddOpen(false);
  };

  const toggleActive = (id) => {
    const a = agents.find((x) => x.id === id);
    setAgents(agents.map((x) => x.id === id ? { ...x, active: !x.active } : x));
    addAudit("Админ (Гульмира)", a.active ? "Заблокирован сотрудник" : "Разблокирован сотрудник", a.name, "");
  };

  const removeAgent = (id) => {
    const a = agents.find((x) => x.id === id);
    setAgents(agents.filter((x) => x.id !== id));
    addAudit("Админ (Гульмира)", "Удалён торговый представитель", a.name, "");
  };

  const statsFor = (login) => {
    const mine = orders.filter((o) => o.type === "agent" && o.agentLogin === login);
    return { count: mine.length, sum: mine.reduce((s, o) => s + o.total, 0) };
  };

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Торговые представители, принимающие заказы по магазинам">Сотрудники</SectionTitle>
      <button onClick={openAdd} className="w-full rounded-2xl p-4 mb-4 flex items-center justify-center gap-2" style={{ border: "1.5px dashed var(--line)", color: "var(--navy)" }}>
        <Ico name="plus-circle" size={18} /><span style={{ fontSize: 13.5, fontWeight: 700 }}>Добавить торгового представителя</span>
      </button>
      <div className="flex flex-col gap-2.5">
        {agents.map((a) => {
          const st = statsFor(a.login);
          return (
            <div key={a.id} className="rounded-2xl p-3.5" style={{ background: "#fff", border: "1px solid var(--line)" }}>
              <div className="flex items-center justify-between mb-1.5">
                <p style={{ fontSize: 14, color: "var(--ink)", fontWeight: 700 }}>{a.name}</p>
                <Toggle checked={a.active} onChange={() => toggleActive(a.id)} />
              </div>
              <div className="flex items-center gap-3 mb-2 flex-wrap">
                <span className="font-mono-kz" style={{ fontSize: 11.5, color: "var(--muted)" }}>Логин: {a.login}</span>
                <span className="font-mono-kz" style={{ fontSize: 11.5, color: "var(--muted)" }}>Пароль: {a.password}</span>
              </div>
              <div className="flex items-center justify-between">
                <span style={{ fontSize: 11.5, color: "var(--muted)" }}>{st.count} заказ(ов) · {money(st.sum)}</span>
                <button onClick={() => removeAgent(a.id)} className="flex items-center gap-1" style={{ fontSize: 11.5, color: "var(--red)", fontWeight: 700 }}>
                  <Ico name="trash" size={12} />Удалить
                </button>
              </div>
            </div>
          );
        })}
        {agents.length === 0 && <p className="text-center py-10" style={{ fontSize: 13, color: "var(--muted)" }}>Сотрудников пока нет</p>}
      </div>

      {addOpen && (
        <Modal title="Новый торговый представитель" onClose={() => setAddOpen(false)}>
          <Field label="ФИО" placeholder="Например, Азамат Турсунов" value={name} onChange={(e) => setName(e.target.value)} autoFocus />
          <Field label="Логин" value={login} onChange={(e) => setLogin(e.target.value)} />
          <Field label="Пароль" value={password} onChange={(e) => setPassword(e.target.value)} />
          <p style={{ fontSize: 11.5, color: "var(--muted)", marginBottom: 12, lineHeight: 1.4 }}>Логин и пароль сгенерированы автоматически — при необходимости измените и передайте сотруднику.</p>
          <PrimaryButton full disabled={!name.trim() || !login.trim() || !password.trim()} onClick={save}>Создать</PrimaryButton>
        </Modal>
      )}
    </div>
  );
}

function AgentLogin({ agents, onCancel, onSuccess }) {
  const [login, setLogin] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  const submit = () => {
    const found = agents.find((a) => a.login === login && a.password === password);
    if (!found) { setError("Неверный логин или пароль"); return; }
    if (!found.active) { setError("Доступ заблокирован администратором"); return; }
    setError("");
    onSuccess(found);

  return (

/* A field sales rep ("торговый представитель") logs in separately, keeps their own list
   of stores ("Мои магазины"), opens a store to see the full warehouse assortment, builds
   an order for that store, picks a payment method (cash / transfer) or marks it as debt,
   and submits it — the order lands on the admin's Orders panel immediately (type: "agent"). */

function AgentStores({ agent, agentStores, setAgentStores, onOpenStore, addAudit }) {
  const [addOpen, setAddOpen] = useState(false);
  const [name, setName] = useState("");
  const [addr, setAddr] = useState("");
  const [phone, setPhone] = useState("");
  const mine = agentStores.filter((s) => s.agentLogin === agent.login);

  const save = () => {
    if (!name.trim()) return;
    const s = { id: "st" + Date.now(), agentLogin: agent.login, name: name.trim(), addr: addr.trim(), phone: phone.trim() };
    setAgentStores([...agentStores, s]);
    addAudit(agent.name, "Добавлен магазин", s.name, s.addr || "—");
    setAddOpen(false); setName(""); setAddr(""); setPhone("");
  };

  return (
    <div className="px-5 pt-4 pb-4 font-body">
      <SectionTitle sub="Магазины, которые вы обслуживаете">Мои магазины</SectionTitle>
      <button onClick={() => setAddOpen(true)} className="w-full rounded-2xl p-4 mb-4 flex items-center justify-center gap-2" style={{ border: "1.5px dashed var(--line)", color: "var(--navy)" }}>

      </button>

        {mine.map((s) => (
          <button key={s.id} onClick={() => onOpenStore(s)} className="text-left rounded-2xl p-3.5 flex items-center gap-3" style={{ background: "#fff", border: "1px solid var(--line)" }}>
            <div className="rounded-xl p-2.5 shrink-0" style={{ background: "#EEF0FF" }}><Ico name="store" size={18} color="var(--navy)" /></div>

              <p style={{ fontSize: 14, color: "var(--ink)", fontWeight: 700 }}>{s.name}</p>
              {s.addr && <p className="truncate" style={{ fontSize: 11.5, color: "var(--muted)" }}>{s.addr}</p>}

  );

function AgentStoreOrder({ store, warehouse, onBack, onSubmitOrder }) {
  const [cart, setCart] = useState({});
  const [activeCat, setActiveCat] = useState(null);
  const [q, setQ] = useState("");
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const [isDebt, setIsDebt] = useState(false);
  const [payMethod, setPayMethod] = useState("cash");

  const filtered = useMemo(() => warehouse.filter((p) =>
    (!activeCat || p.cat === activeCat) && (!q || p.name.toLowerCase().includes(q.toLowerCase()))
  ), [activeCat, q, warehouse]);

  const items = Object.entries(cart).map(([id, qty]) => ({ p: warehouse.find((x) => x.id === Number(id)), qty })).filter((it) => it.p);
  const total = items.reduce((s, it) => s + it.p.price * it.qty, 0);
  const cartCount = Object.values(cart).reduce((a, b) => a + b, 0);

  const submit = () => {
    onSubmitOrder({ items, total, isDebt, payMethod });

        </div>
        <div className="flex gap-2 overflow-x-auto mb-4 pb-1" style={{ scrollbarWidth: "none" }}>
          <button onClick={() => setActiveCat(null)} className="shrink-0 px-3.5 py-2 rounded-full font-semibold"
            style={{ fontSize: 12, background: !activeCat ? "var(--navy)" : "#F2F1F8", color: !activeCat ? "#fff" : "var(--ink)" }}>Все</button>
          {CATEGORIES.map((c) => (
            <button key={c.id} onClick={() => setActiveCat(c.id)} className="shrink-0 px-3.5 py-2 rounded-full font-semibold flex items-center gap-1"
              style={{ fontSize: 12, background: activeCat === c.id ? "var(--navy)" : "#F2F1F8", color: activeCat === c.id ? "#fff" : "var(--ink)" }}>
              <span>{c.emoji}</span>{c.name}
            </button>
          ))}
        </div>
        <div className="grid grid-cols-2 gap-3">
          {filtered.map((p) => (
            <ProductCard key={p.id} p={p} qty={cart[p.id] || 0}
              onAdd={() => setCart({ ...cart, [p.id]: 1 })}
              onInc={() => setCart({ ...cart, [p.id]: (cart[p.id] || 0) + 1 })}
              onDec={() => { const n = { ...cart }; if (n[p.id] <= 1) delete n[p.id]; else n[p.id] -= 1; setCart(n); }} />
          ))}

          </PrimaryButton>

      {checkoutOpen && (
        <Modal title="Оформление заказа" onClose={() => setCheckoutOpen(false)} wide>

              <div className="flex-1 min-w-0">
                <p className="truncate" style={{ fontSize: 13, color: "var(--ink)", fontWeight: 600 }}>{p.name}</p>
                <p className="font-mono-kz" style={{ fontSize: 12, color: "var(--navy)", fontWeight: 700 }}>{money(p.price * qty)}</p>
              </div>
              <div className="flex items-center gap-1 rounded-lg px-1 py-1" style={{ background: "#F2F1F8" }}>

                <span className="font-mono-kz" style={{ fontSize: 12, width: 18, textAlign: "center" }}>{qty}</span>

              </div>
            </div>
          )}

          <div className="flex items-center justify-between py-4">
            <span style={{ fontSize: 13, color: "var(--muted)", fontWeight: 600 }}>Итого</span>
            <span className="font-mono-kz" style={{ fontSize: 20, color: "var(--ink)", fontWeight: 800 }}>{money(total)}</span>
          </div>
          <PrimaryButton full disabled={items.length === 0} onClick={submit}>Отправить в обработку</PrimaryButton>
        </Modal>

    </div>
  );
}

          <Ico name="arrow-left" size={13} color="var(--red)" />
          <span style={{ fontSize: 11, fontWeight: 700, color: "var(--red)" }}>Выход</span>
        </button>
      </div>
      <div className="flex-1 flex flex-col overflow-hidden">
        {activeStore ? (
          <AgentStoreOrder store={activeStore} warehouse={warehouse} onBack={() => setActiveStore(null)} onSubmitOrder={submitOrder} />
        ) : (
          <div className="flex-1 overflow-y-auto pb-24">
            {screen === "stores"
              ? <AgentStores agent={agent} agentStores={agentStores} setAgentStores={setAgentStores} onOpenStore={setActiveStore} addAudit={addAudit} />

      <Toast toast={toast} />
    </div>
  );
}

/* ============================== MANAGEMENT SYSTEM (ТЗ V1.0) ============================== */
// Единая система управления Sapar Trade: дашборд владельца, продажи, ТП и супервайзеры,
// GPS-маршруты, водители, склад и dead stock, дебиторка, P&L, KPI/Score, проблемы,
// задачи, AI-ассистент, интеграции 1С / Sales Doctor, RBAC, аудит и экспорт.
// ВАЖНО: это фронтенд с демо-данными. Реальные цифры приходят только после подключения
// Backend API к 1С и Sales Doctor; права (RBAC) на проде проверяются на сервере.

function mkRng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const DAY_MS = 86400000;
const sod = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const eod = (d) => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
const addD = (d, n) => { const x = sod(d); x.setDate(x.getDate() + n); return x; };
const pctOf = (a, b) => (b ? (a / b) * 100 : 0);
const fp = (n, d = 1) => (isFinite(n) ? n.toFixed(d).replace(".", ",") : "0") + "%";
const shortMoney = (n) => {
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2).replace(".", ",") + " млрд ₸";
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace(".", ",") + " млн ₸";
  if (a >= 1e4) return Math.round(n / 1e3).toLocaleString("ru-RU") + " тыс ₸";
  return money(Math.round(n));
};

const MG_PERIODS = [["today", "Сегодня"], ["yesterday", "Вчера"], ["week", "Эта неделя"], ["lweek", "Прошлая неделя"], ["month", "Этот месяц"],
  ["lmonth", "Прошлый месяц"], ["quarter", "Квартал"], ["year", "Этот год"], ["lyear", "Прошлый год"], ["custom", "Свои даты"]];

function mgRange(id, custom) {
  const now = new Date(); const t = sod(now);
  const mon = addD(t, -((t.getDay() + 6) % 7));
  const shift = (a, b, days) => ({ from: a, to: b, pf: addD(a, -days), pt: new Date(b.getTime() - days * DAY_MS) });
  const monthBack = (d, k) => { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() - k); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return x; };
  switch (id) {
    case "today": return shift(t, now, 1);
    case "yesterday": return shift(addD(t, -1), eod(addD(t, -1)), 1);
    case "week": return shift(mon, now, 7);
    case "lweek": return shift(addD(mon, -7), eod(addD(mon, -1)), 7);
    case "month": { const f = new Date(t.getFullYear(), t.getMonth(), 1); return { from: f, to: now, pf: monthBack(f, 1), pt: eod(monthBack(t, 1)) }; }
    case "lmonth": { const f = new Date(t.getFullYear(), t.getMonth() - 1, 1); const e = eod(new Date(t.getFullYear(), t.getMonth(), 0)); return { from: f, to: e, pf: new Date(t.getFullYear(), t.getMonth() - 2, 1), pt: eod(new Date(t.getFullYear(), t.getMonth() - 1, 0)) }; }
    case "quarter": { const q = Math.floor(t.getMonth() / 3) * 3; const f = new Date(t.getFullYear(), q, 1); return { from: f, to: now, pf: monthBack(f, 3), pt: eod(monthBack(t, 3)) }; }
    case "year": { const f = new Date(t.getFullYear(), 0, 1); return { from: f, to: now, pf: new Date(t.getFullYear() - 1, 0, 1), pt: eod(new Date(t.getFullYear() - 1, t.getMonth(), t.getDate())) }; }
    case "lyear": return { from: new Date(t.getFullYear() - 1, 0, 1), to: eod(new Date(t.getFullYear() - 1, 11, 31)), pf: new Date(t.getFullYear() - 2, 0, 1), pt: eod(new Date(t.getFullYear() - 2, 11, 31)) };
    default: {
      const f = sod(custom.from), e = eod(custom.to); const len = Math.max(1, Math.round((e - f) / DAY_MS));
      return { from: f, to: e, pf: addD(f, -len), pt: new Date(e.getTime() - len * DAY_MS) };
    }
  }
}

function mgAgg(from, to, f = {}) {
  const a = { rev: 0, cost: 0, ret: 0, plan: 0, vPlan: 0, vFact: 0, vEff: 0, newCl: 0, km: 0, sku: 0, skuPlan: 0, cash: 0, days: 0 };
  const fs = from.getTime(), ts = to.getTime();
  for (const x of MG.facts) {
    if (x.t < fs || x.t > ts) continue;
    if (f.tp && x.tp !== f.tp) continue;
    if (f.sv && MG.tpById[x.tp].sv !== f.sv) continue;
    a.rev += x.rev; a.cost += x.cost; a.ret += x.ret; a.plan += x.plan; a.vPlan += x.vPlan; a.vFact += x.vFact; a.vEff += x.vEff;
    a.newCl += x.newCl; a.km += x.km; a.sku += x.sku; a.skuPlan += x.skuPlan; a.cash += x.cash;
  }
  a.netRev = a.rev - a.ret;
  a.cogs = a.rev ? a.cost * (a.netRev / a.rev) : 0;
  a.gross = a.netRev - a.cogs;
  a.margin = pctOf(a.gross, a.netRev);
  a.opexBy = MG.EXP.map(([k]) => [k, 0]);
  const endT = Math.min(ts, Date.now());
  for (let d = sod(from); d.getTime() <= endT; d = addD(d, 1)) {
    a.days++;
    const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    MG.EXP.forEach(([, m], i) => { a.opexBy[i][1] += m / dim; });
  }
  a.opex = a.opexBy.reduce((s, x) => s + x[1], 0);
  a.ebitda = a.gross - a.opex;
  a.tax = Math.max(0, a.ebitda * 0.2);
  a.net = a.ebitda - a.tax;
  a.netMargin = pctOf(a.net, a.netRev);
  a.planPct = pctOf(a.netRev, a.plan);
  a.effPct = pctOf(a.vEff, a.vFact);
  a.routePct = pctOf(a.vFact, a.vPlan);
  a.retPct = pctOf(a.ret, a.rev);
  a.avgCheck = a.vEff ? a.netRev / a.vEff : 0;
  return a;
}

function mgSeries(from, to, f) {
  const days = Math.max(1, Math.round((Math.min(to, Date.now()) - from) / DAY_MS) + 1);
  const step = days <= 31 ? 1 : days <= 120 ? 7 : 30;
  const out = [];
  for (let d = sod(from); d.getTime() <= Math.min(to.getTime(), Date.now()); d = addD(d, step)) {
    const e = eod(addD(d, step - 1));
    const a = mgAgg(d, e > to ? to : e, f);
    out.push({ label: step === 30 ? String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getFullYear()).slice(2) : d.getDate() + "." + String(d.getMonth() + 1).padStart(2, "0"), v: a.netRev });
  }
  return out;
}

const DEFAULT_WEIGHTS = { plan: 35, visit: 20, route: 15, ret: 10, debt: 10, sku: 5, disc: 5 };
function tpScore(tp, a, w) {
  const debtCl = MG.clients.filter((c) => c.tp === tp.id);
  const debtOk = debtCl.length ? debtCl.filter((c) => c.overdue <= 7).length / debtCl.length : 1;
  const parts = {
    plan: Math.min(1, a.planPct / 100), visit: Math.min(1, a.effPct / 80), route: Math.min(1, a.routePct / 100),
    ret: Math.max(0, 1 - a.retPct / 5), debt: debtOk, sku: Math.min(1, a.skuPlan ? a.sku / a.skuPlan : 0), disc: tp.discipline,
  };
  const total = Object.values(w).reduce((s, x) => s + Number(x), 0) || 1;
  const score = Object.keys(w).reduce((s, k) => s + parts[k] * Number(w[k]), 0) / total * 100;
  return { score: Math.round(score), parts };
}

function agingBuckets(list) {
  const b = [["В срок", 0, 0], ["1–7 дней", 1, 7], ["8–14 дней", 8, 14], ["15–30 дней", 15, 30], ["31–60 дней", 31, 60], ["60+ дней", 61, 9999]];
  return b.map(([label, lo, hi]) => ({ label, sum: list.filter((c) => c.debt && c.overdue >= lo && c.overdue <= hi).reduce((s, c) => s + c.debt, 0) }));
}

function stockView(warehouse) {
  return warehouse.map((p) => {
    const m = MG.prodMeta[p.id] || { cost: Math.round(p.price * 0.78), avgDaily: 2, lastMove: 0, inQ: 0, outQ: 0, retQ: 0, brak: 0, wo: 0, peresort: 0, expiring: 0 };
    const cover = m.avgDaily ? Math.floor(p.stock / m.avgDaily) : 999;
    return { ...p, ...m, cover, sumSale: p.stock * p.price, sumCost: p.stock * m.cost };
  });
}

function mgProblems(role, warehouse) {
  const now = new Date();
  const m = mgAgg(new Date(now.getFullYear(), now.getMonth(), 1), now);
  const list = [];
  const fin = MG_ROLES[role].fin;
  if (m.planPct < 95) list.push({ lvl: "red", text: "Отставание от плана продаж: выполнено " + fp(m.planPct), tab: "sales", who: ["owner", "director", "supervisor"] });
  const lm = mgAgg(new Date(now.getFullYear(), now.getMonth() - 1, 1), eod(new Date(now.getFullYear(), now.getMonth(), 0)));
  if (m.retPct > lm.retPct) list.push({ lvl: "yellow", text: "Рост возвратов: " + fp(m.retPct) + " против " + fp(lm.retPct) + " в прошлом месяце", tab: "sales", who: ["owner", "director", "supervisor"] });
  const over60 = MG.clients.filter((c) => c.overdue > 60);
  if (over60.length) list.push({ lvl: "red", text: "Просрочка более 60 дней — клиентов: " + over60.length + ", сумма " + shortMoney(over60.reduce((s, c) => s + c.debt, 0)), tab: "clients", who: ["owner", "director", "supervisor", "accountant", "financier"] });
  const late = MG.clients.filter((c) => c.overdue > 14 && c.overdue <= 60);
  if (late.length) list.push({ lvl: "yellow", text: "Задержка оплаты 15–60 дней — клиентов: " + late.length, tab: "clients", who: ["owner", "director", "supervisor", "accountant", "financier", "tp"] });
  MG.tps.forEach((tp) => { if (tp.routeAdh < 0.8) list.push({ lvl: "yellow", text: tp.name + ": выполнение маршрута ниже 80%", tab: "team", who: ["owner", "director", "supervisor"] }); });
  const lostDr = FLEET.filter((d) => d.lostSignal);
  if (lostDr.length) list.push({ lvl: "red", text: "Экспедитор без сигнала GPS более 5 мин: " + lostDr.map((d) => d.name).join(", "), tab: "fleet", who: ["owner", "director"] });
  list.push({ lvl: "yellow", text: "Незавершённые доставки: " + MG.deliveries.filter((d) => !["Доставлен", "Закрыт"].includes(d.status)).length, tab: "home", who: ["owner", "director", "driver"] });
  const sv = stockView(warehouse);
  const low = sv.filter((p) => p.cover < 7);
  if (low.length) list.push({ lvl: "red", text: "Низкий остаток (меньше 7 дней продаж): " + low.length + " SKU", tab: "stock", who: ["owner", "director", "warehouse"] });
  const dead = sv.filter((p) => p.lastMove >= 30);
  if (dead.length) list.push({ lvl: "yellow", text: "Dead stock (нет движения 30+ дней): " + dead.length + " SKU", tab: "stock", who: ["owner", "director", "warehouse"] });
  if (m.margin < 21) list.push({ lvl: "red", text: "Маржа ниже целевой: " + fp(m.margin), tab: "sales", who: ["owner", "director"] });
  if (fin === "full" && m.netMargin < 5) list.push({ lvl: "red", text: "Чистая рентабельность ниже 5%: " + fp(m.netMargin), tab: "finance", who: ["owner"] });
  if (fin === "full") list.push({ lvl: "green", text: "Валовая прибыль за месяц: " + shortMoney(m.gross), tab: "finance", who: ["owner"] });
  list.push({ lvl: "green", text: "Новых клиентов за месяц: " + m.newCl, tab: "clients", who: ["owner", "director", "supervisor"] });
  return list.filter((p) => p.who.includes(role));
}

function MgTrend({ data, color = "#1B1464" }) {
  if (!data.length) return null;
  const W = 320, H = 100, p = 6;
  const max = Math.max(...data.map((d) => d.v), 1), min = Math.min(...data.map((d) => d.v), 0);
  const pts = data.map((d, i) => [data.length > 1 ? p + (i / (data.length - 1)) * (W - p * 2) : W / 2, H - p - ((d.v - min) / (max - min || 1)) * (H - p * 2)]);
  const line = pts.map((x) => x.join(",")).join(" ");
  const every = Math.ceil(data.length / 6);
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" height="100" preserveAspectRatio="none">
        <polygon points={`${pts[0][0]},${H} ${line} ${pts[pts.length - 1][0]},${H}`} fill={color} opacity="0.08" />
        <polyline points={line} fill="none" stroke={color} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round" />
      </svg>
      <div className="flex justify-between">
        {data.map((d, i) => (i % every === 0 || i === data.length - 1) ? <span key={i} className="font-mono-kz" style={{ fontSize: 9, color: "var(--muted)" }}>{d.label}</span> : null)}
      </div>
    </div>
  );
}

function downloadCsv(name, rows) {
  const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = "﻿" + rows.map((r) => r.map(esc).join(";")).join("\n");
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
